<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chrono Tower">
  <link id="apple-icon" rel="apple-touch-icon" sizes="180x180" href="">
  <link id="fav-icon" rel="icon" type="image/png" href="">
  <title>Chrono Tower</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141829;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: max(16px, env(safe-area-inset-top)) 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    #score-wrap {
      text-align: left;
    }

    #score {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    #best {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.9;
      margin-top: 4px;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #altitude-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 4px;
      color: #ffe66d;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    #sfx-btn {
      pointer-events: auto;
      background: rgba(15, 22, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #sfx-btn:active {
      background: rgba(255, 255, 255, 0.35);
    }

    #combo-msg {
      position: fixed;
      top: 115px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffe66d;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.2s;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 14, 28, 0.62);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 20;
      text-align: center;
      padding: 24px;
      transition: opacity 0.25s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      margin-bottom: 16px;
      border-radius: 24px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    #overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 44px);
      font-weight: 900;
      letter-spacing: 2.5px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    #overlay p {
      margin: 0 0 26px;
      font-size: 15px;
      opacity: 0.92;
      max-width: 310px;
      line-height: 1.45;
    }

    #play-btn {
      background: #ffffff;
      color: #141829;
      border: none;
      padding: 16px 44px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    #play-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="score-wrap">
      <div id="score">0</div>
      <div id="best">BEST: 0</div>
      <div id="altitude-tag">GROUND LEVEL</div>
    </div>
    <button type="button" id="sfx-btn">SFX: ON</button>
  </div>

  <div id="combo-msg">PERFECT x1</div>

  <div id="overlay">
    <svg id="app-icon-svg" class="app-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Chrono Tower Icon">
      <defs>
        <linearGradient id="iconSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070b19"/>
          <stop offset="55%" stop-color="#1b3b6f"/>
          <stop offset="100%" stop-color="#2d6a4f"/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" rx="26" fill="url(#iconSky)"/>
      <circle cx="26" cy="22" r="1.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="94" cy="26" r="1.8" fill="#ffffff" opacity="0.9"/>
      <circle cx="84" cy="15" r="1.2" fill="#ffffff" opacity="0.6"/>
      <circle cx="38" cy="36" r="1.2" fill="#ffffff" opacity="0.7"/>
      <!-- Ground horizon arc -->
      <path d="M 0 98 Q 60 88 120 98 L 120 120 L 0 120 Z" fill="#1b4332"/>
      <!-- Bottom tier -->
      <polygon points="60,72 90,87 60,102 30,87" fill="#3a86ff"/>
      <polygon points="30,87 60,102 60,110 30,95" fill="#2667cc"/>
      <polygon points="90,87 60,102 60,110 90,95" fill="#1b4999"/>
      <!-- Second tier -->
      <polygon points="60,55 86,68 60,81 34,68" fill="#00f5d4"/>
      <polygon points="34,68 60,81 60,89 34,76" fill="#00bfa6"/>
      <polygon points="86,68 60,81 60,89 86,76" fill="#008c7a"/>
      <!-- Third tier -->
      <polygon points="60,38 82,49 60,60 38,49" fill="#fee440"/>
      <polygon points="38,49 60,60 60,68 38,57" fill="#d9c026"/>
      <polygon points="82,49 60,60 60,68 82,57" fill="#a89314"/>
      <!-- Floating apex block in space -->
      <polygon points="60,17 78,26 60,35 42,26" fill="#ff2a85"/>
      <polygon points="42,26 60,35 60,42 42,33" fill="#d11b6a"/>
      <polygon points="78,26 60,35 60,42 78,33" fill="#9c114e"/>
    </svg>
    <h1 id="ov-title">CHRONO TOWER</h1>
    <p id="ov-sub">Build from the ground up into deep space. Tap, click, or press Space to stack.</p>
    <button type="button" id="play-btn">START</button>
  </div>

  <script>
    (function () {
      function generateHomeScreenIcon() {
        try {
          var iconCanvas = document.createElement('canvas');
          iconCanvas.width = 180;
          iconCanvas.height = 180;
          var ictx = iconCanvas.getContext('2d');
          var s = 180 / 120;
          ictx.scale(s, s);

          var skyGrad = ictx.createLinearGradient(0, 0, 0, 120);
          skyGrad.addColorStop(0, '#070b19');
          skyGrad.addColorStop(0.55, '#1b3b6f');
          skyGrad.addColorStop(1, '#2d6a4f');
          ictx.fillStyle = skyGrad;
          ictx.fillRect(0, 0, 120, 120);

          var starPts = [[26, 22, 1.6, 0.85], [94, 26, 1.8, 0.9], [84, 15, 1.2, 0.6], [38, 36, 1.2, 0.7]];
          for (var i = 0; i < starPts.length; i++) {
            ictx.fillStyle = 'rgba(255,255,255,' + starPts[i][3] + ')';
            ictx.beginPath();
            ictx.arc(starPts[i][0], starPts[i][1], starPts[i][2], 0, Math.PI * 2);
            ictx.fill();
          }

          ictx.fillStyle = '#1b4332';
          ictx.beginPath();
          ictx.moveTo(0, 98);
          ictx.quadraticCurveTo(60, 88, 120, 98);
          ictx.lineTo(120, 120);
          ictx.lineTo(0, 120);
          ictx.closePath();
          ictx.fill();

          function poly(pts, col) {
            ictx.fillStyle = col;
            ictx.beginPath();
            ictx.moveTo(pts[0][0], pts[0][1]);
            for (var p = 1; p < pts.length; p++) ictx.lineTo(pts[p][0], pts[p][1]);
            ictx.closePath();
            ictx.fill();
          }

          poly([[60,72],[90,87],[60,102],[30,87]], '#3a86ff');
          poly([[30,87],[60,102],[60,110],[30,95]], '#2667cc');
          poly([[90,87],[60,102],[60,110],[90,95]], '#1b4999');
          poly([[60,55],[86,68],[60,81],[34,68]], '#00f5d4');
          poly([[34,68],[60,81],[60,89],[34,76]], '#00bfa6');
          poly([[86,68],[60,81],[60,89],[86,76]], '#008c7a');
          poly([[60,38],[82,49],[60,60],[38,49]], '#fee440');
          poly([[38,49],[60,60],[60,68],[38,57]], '#d9c026');
          poly([[82,49],[60,60],[60,68],[82,57]], '#a89314');
          poly([[60,17],[78,26],[60,35],[42,26]], '#ff2a85');
          poly([[42,26],[60,35],[60,42],[42,33]], '#d11b6a');
          poly([[78,26],[60,35],[60,42],[78,33]], '#9c114e');

          var pngUrl = iconCanvas.toDataURL('image/png');
          var appleLink = document.getElementById('apple-icon');
          var favLink = document.getElementById('fav-icon');
          if (appleLink) appleLink.href = pngUrl;
          if (favLink) favLink.href = pngUrl;
        } catch (e) {}
      }
      generateHomeScreenIcon();

      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var W = window.innerWidth || 800;
      var H = window.innerHeight || 600;

      function resize() {
        W = window.innerWidth || 800;
        H = window.innerHeight || 600;
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      var bestScore = 0;
      try {
        var saved = window.localStorage.getItem('chrono_tower_best_v4');
        if (saved) bestScore = parseInt(saved, 10) || 0;
      } catch (e) {}
      document.getElementById('best').textContent = 'BEST: ' + bestScore;

      var audioCtx = null;
      var sfxEnabled = true;
      var scaleNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

      function playNote(comboIdx, isFail) {
        if (!sfxEnabled) return;
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (!audioCtx) return;
          if (audioCtx.state === 'suspended') audioCtx.resume();

          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          if (isFail) {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
          } else {
            var note = scaleNotes[Math.min(scaleNotes.length - 1, comboIdx)];
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.28);
          }
        } catch (e) {}
      }

      document.getElementById('sfx-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        sfxEnabled = !sfxEnabled;
        this.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      });

      var BLOCK_H = 26;
      var BASE_SIZE = 150;
      var stack = [];
      var debris = [];
      var ripples = [];
      var activeBlock = null;
      var gameState = 'MENU';
      var score = 0;
      var combo = 0;
      var passedRecord = false;
      var cameraX = 0;
      var cameraY = 0;
      var cameraZ = 0;
      var targetCameraX = 0;
      var targetCameraY = 0;
      var targetCameraZ = 0;
      var baseHue = 200;

      var stars = [];
      for (var sIdx = 0; sIdx < 110; sIdx++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() < 0.25 ? 2.2 : 1.2,
          twinkle: 1.5 + Math.random() * 3
        });
      }

      var clouds = [];
      for (var cIdx = 0; cIdx < 8; cIdx++) {
        clouds.push({
          x: (Math.random() - 0.5) * 900,
          y: 220 + cIdx * 155,
          w: 115 + Math.random() * 95,
          speed: (Math.random() < 0.5 ? 1 : -1) * (10 + Math.random() * 14)
        });
      }

      function isoToScreen(x, y, z) {
        var rx = x - cameraX;
        var rz = z - cameraZ;
        var originX = W / 2;
        var originY = H * 0.68 + cameraY;
        var sx = originX + (rx - rz) * 0.866;
        var sy = originY + (rx + rz) * 0.5 - y;
        return { x: sx, y: sy };
      }

      function hsl(h, s, l) {
        return 'hsl(' + (h % 360) + ',' + s + '%,' + l + '%)';
      }

      function drawIsoBox(x, y, z, w, h, d, hue) {
        var p0 = isoToScreen(x, y + h, z);
        var p1 = isoToScreen(x + w, y + h, z);
        var p2 = isoToScreen(x + w, y + h, z + d);
        var p3 = isoToScreen(x, y + h, z + d);

        var b1 = isoToScreen(x + w, y, z);
        var b2 = isoToScreen(x + w, y, z + d);
        var b3 = isoToScreen(x, y, z + d);

        ctx.fillStyle = hsl(hue, 72, 68);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = hsl(hue, 65, 52);
        ctx.beginPath();
        ctx.moveTo(p3.x, p3.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = hsl(hue, 60, 38);
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.closePath();
        ctx.fill();
      }

      function drawProjectedOverlap(top, b) {
        var x1 = Math.max(top.x, b.x);
        var x2 = Math.min(top.x + top.w, b.x + b.w);
        var z1 = Math.max(top.z, b.z);
        var z2 = Math.min(top.z + top.d, b.z + b.d);

        if (x2 <= x1 || z2 <= z1) return;

        var yTop = top.y + top.h;
        var p0 = isoToScreen(x1, yTop, z1);
        var p1 = isoToScreen(x2, yTop, z1);
        var p2 = isoToScreen(x2, yTop, z2);
        var p3 = isoToScreen(x1, yTop, z2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.26)';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();
      }

      function updateAltitudeLabel() {
        var tag = document.getElementById('altitude-tag');
        if (score >= 45) tag.textContent = 'DEEP SPACE';
        else if (score >= 30) tag.textContent = 'ORBITAL ZONE';
        else if (score >= 15) tag.textContent = 'STRATOSPHERE';
        else if (score >= 5) tag.textContent = 'CLOUD LAYER';
        else tag.textContent = 'GROUND LEVEL';
      }

      function spawnNextBlock() {
        var top = stack[stack.length - 1];
        var axis = stack.length % 2 === 1 ? 'x' : 'z';
        var speed = Math.min(340, 155 + stack.length * 4.2);
        var hue = baseHue + stack.length * 7;
        var span = axis === 'x' ? top.w : top.d;
        var swingRange = span + 55;

        activeBlock = {
          x: axis === 'x' ? (top.x - swingRange) : top.x,
          y: top.y + top.h,
          z: axis === 'z' ? (top.z - swingRange) : top.z,
          w: top.w,
          d: top.d,
          axis: axis,
          dir: 1,
          speed: speed,
          swingRange: swingRange,
          hue: hue
        };
      }

      function initFoundation() {
        stack = [];
        stack.push({
          x: -BASE_SIZE / 2,
          y: 0,
          z: -BASE_SIZE / 2,
          w: BASE_SIZE,
          h: BLOCK_H * 1.4,
          d: BASE_SIZE,
          hue: baseHue
        });
      }

      function startGame() {
        baseHue = Math.floor(Math.random() * 360);
        initFoundation();
        debris = [];
        ripples = [];
        score = 0;
        combo = 0;
        passedRecord = false;
        cameraX = 0;
        cameraY = 0;
        cameraZ = 0;
        targetCameraX = 0;
        targetCameraY = 0;
        targetCameraZ = 0;

        document.getElementById('score').textContent = '0';
        document.getElementById('combo-msg').style.opacity = '0';
        updateAltitudeLabel();
        document.getElementById('overlay').classList.add('hidden');
        gameState = 'PLAYING';
        spawnNextBlock();
      }

      function gameOver() {
        gameState = 'OVER';
        playNote(0, true);
        if (score > bestScore) {
          bestScore = score;
          try {
            window.localStorage.setItem('chrono_tower_best_v4', String(bestScore));
          } catch (e) {}
          document.getElementById('best').textContent = 'BEST: ' + bestScore;
        }
        document.getElementById('ov-title').textContent = 'TOWER COMPLETE';
        document.getElementById('ov-sub').textContent = 'Height: ' + score + ' floors | Best: ' + bestScore;
        document.getElementById('play-btn').textContent = 'PLAY AGAIN';
        document.getElementById('overlay').classList.remove('hidden');
      }

      function placeBlock() {
        if (gameState !== 'PLAYING' || !activeBlock) return;
        var top = stack[stack.length - 1];
        var b = activeBlock;
        var SNAP_TOLERANCE = 7;

        if (b.axis === 'x') {
          var deltaX = b.x - top.x;
          if (Math.abs(deltaX) <= SNAP_TOLERANCE) {
            var newW = top.w;
            var newX = top.x;
            combo += 1;
            if (combo >= 5) {
              var growW = 10;
              newW = Math.min(BASE_SIZE, top.w + growW);
              newX = top.x - (newW - top.w) / 2;
            }
            stack.push({ x: newX, y: b.y, z: top.z, w: newW, h: BLOCK_H, d: top.d, hue: b.hue });
            ripples.push({ x: newX, y: b.y, z: top.z, w: newW, d: top.d, alpha: 0.9, expand: 0 });
            playNote(combo - 1, false);
            showCombo(combo);
          } else if (Math.abs(deltaX) >= top.w) {
            debris.push({
              x: b.x, y: b.y, z: top.z, w: top.w, h: BLOCK_H, d: top.d,
              hue: b.hue, vy: 0, vx: deltaX > 0 ? 55 : -55, vz: 0,
              behind: deltaX < 0
            });
            activeBlock = null;
            gameOver();
            return;
          } else {
            combo = 0;
            document.getElementById('combo-msg').style.opacity = '0';
            var overlapW = Math.max(4, Math.min(top.w, top.w - Math.abs(deltaX)));
            var cutW = Math.abs(deltaX);
            var placedX = deltaX > 0 ? b.x : top.x;
            var cutX = deltaX > 0 ? (placedX + overlapW) : b.x;

            stack.push({ x: placedX, y: b.y, z: top.z, w: overlapW, h: BLOCK_H, d: top.d, hue: b.hue });
            debris.push({
              x: cutX, y: b.y, z: top.z, w: cutW, h: BLOCK_H, d: top.d,
              hue: b.hue, vy: 0, vx: deltaX > 0 ? 75 : -75, vz: 0,
              behind: deltaX < 0
            });
            playNote(0, false);
          }
        } else {
          var deltaZ = b.z - top.z;
          if (Math.abs(deltaZ) <= SNAP_TOLERANCE) {
            var newD = top.d;
            var newZ = top.z;
            combo += 1;
            if (combo >= 5) {
              var growD = 10;
              newD = Math.min(BASE_SIZE, top.d + growD);
              newZ = top.z - (newD - top.d) / 2;
            }
            stack.push({ x: top.x, y: b.y, z: newZ, w: top.w, h: BLOCK_H, d: newD, hue: b.hue });
            ripples.push({ x: top.x, y: b.y, z: newZ, w: top.w, d: newD, alpha: 0.9, expand: 0 });
            playNote(combo - 1, false);
            showCombo(combo);
          } else if (Math.abs(deltaZ) >= top.d) {
            debris.push({
              x: top.x, y: b.y, z: b.z, w: top.w, h: BLOCK_H, d: top.d,
              hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 55 : -55,
              behind: deltaZ < 0
            });
            activeBlock = null;
            gameOver();
            return;
          } else {
            combo = 0;
            document.getElementById('combo-msg').style.opacity = '0';
            var overlapD = Math.max(4, Math.min(top.d, top.d - Math.abs(deltaZ)));
            var cutD = Math.abs(deltaZ);
            var placedZ = deltaZ > 0 ? b.z : top.z;
            var cutZ = deltaZ > 0 ? (placedZ + overlapD) : b.z;

            stack.push({ x: top.x, y: b.y, z: placedZ, w: top.w, h: BLOCK_H, d: overlapD, hue: b.hue });
            debris.push({
              x: top.x, y: b.y, z: cutZ, w: top.w, h: BLOCK_H, d: cutD,
              hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 75 : -75,
              behind: deltaZ < 0
            });
            playNote(0, false);
          }
        }

        score += 1;
        document.getElementById('score').textContent = String(score);
        updateAltitudeLabel();

        if (!passedRecord && bestScore > 0 && score > bestScore) {
          passedRecord = true;
          var el = document.getElementById('combo-msg');
          el.textContent = 'NEW RECORD!';
          el.style.opacity = '1';
          var topBlock = stack[stack.length - 1];
          ripples.push({ x: topBlock.x, y: topBlock.y, z: topBlock.z, w: topBlock.w, d: topBlock.d, alpha: 1.0, expand: 0 });
        }

        var latest = stack[stack.length - 1];
        targetCameraX = latest.x + latest.w / 2;
        targetCameraZ = latest.z + latest.d / 2;
        targetCameraY = latest.y;

        spawnNextBlock();
      }

      function showCombo(c) {
        var el = document.getElementById('combo-msg');
        el.textContent = c >= 5 ? 'EXPAND! x' + c : 'PERFECT x' + c;
        el.style.opacity = '1';
      }

      document.getElementById('play-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });

      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (gameState === 'PLAYING') placeBlock();
      });

      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          if (gameState === 'PLAYING') placeBlock();
          else startGame();
        }
      });

      var lastTime = performance.now();

      function update(dt) {
        var camLerp = Math.min(1, dt * 7.5);
        cameraX += (targetCameraX - cameraX) * camLerp;
        cameraY += (targetCameraY - cameraY) * camLerp;
        cameraZ += (targetCameraZ - cameraZ) * camLerp;

        for (var c = 0; c < clouds.length; c++) {
          clouds[c].x += clouds[c].speed * dt;
          if (clouds[c].x > 650) clouds[c].x = -650;
          if (clouds[c].x < -650) clouds[c].x = 650;
        }

        if (gameState === 'PLAYING' && activeBlock) {
          var top = stack[stack.length - 1];
          var sr = activeBlock.swingRange;
          if (activeBlock.axis === 'x') {
            activeBlock.x += activeBlock.dir * activeBlock.speed * dt;
            if (activeBlock.x > top.x + sr) {
              activeBlock.x = top.x + sr;
              activeBlock.dir = -1;
            } else if (activeBlock.x < top.x - sr) {
              activeBlock.x = top.x - sr;
              activeBlock.dir = 1;
            }
          } else {
            activeBlock.z += activeBlock.dir * activeBlock.speed * dt;
            if (activeBlock.z > top.z + sr) {
              activeBlock.z = top.z + sr;
              activeBlock.dir = -1;
            } else if (activeBlock.z < top.z - sr) {
              activeBlock.z = top.z - sr;
              activeBlock.dir = 1;
            }
          }
        }

        for (var i = debris.length - 1; i >= 0; i--) {
          var d = debris[i];
          d.vy -= 760 * dt;
          d.y += d.vy * dt;
          d.x += d.vx * dt;
          d.z += d.vz * dt;
          if (d.y < cameraY - 520) {
            debris.splice(i, 1);
          }
        }

        for (var r = ripples.length - 1; r >= 0; r--) {
          var rp = ripples[r];
          rp.expand += 65 * dt;
          rp.alpha -= 1.8 * dt;
          if (rp.alpha <= 0) {
            ripples.splice(r, 1);
          }
        }
      }

      function render(now) {
        var time = (now || performance.now()) * 0.001;
        var alt = Math.min(1, Math.max(0, (stack.length - 1) / 50));

        var topR = Math.round(45 * (1 - alt) + 5 * alt);
        var topG = Math.round(115 * (1 - alt) + 7 * alt);
        var topB = Math.round(185 * (1 - alt) + 20 * alt);

        var botR = Math.round(125 * (1 - alt) + 14 * alt);
        var botG = Math.round(190 * (1 - alt) + 18 * alt);
        var botB = Math.round(230 * (1 - alt) + 46 * alt);

        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, 'rgb(' + topR + ',' + topG + ',' + topB + ')');
        bg.addColorStop(1, 'rgb(' + botR + ',' + botG + ',' + botB + ')');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        var starAlpha = Math.max(0, Math.min(1, (alt - 0.22) / 0.55));
        if (starAlpha > 0.01) {
          for (var s = 0; s < stars.length; s++) {
            var st = stars[s];
            var pulse = 0.55 + 0.45 * Math.sin(time * st.twinkle + s);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (starAlpha * pulse).toFixed(2) + ')';
            ctx.fillRect(st.x * W, st.y * H, st.size, st.size);
          }
        }

        var groundScreenY = H * 0.68 + cameraY;
        if (groundScreenY < H + 260) {
          var gGrad = ctx.createLinearGradient(0, groundScreenY - 25, 0, H);
          gGrad.addColorStop(0, '#2d6a4f');
          gGrad.addColorStop(1, '#1b4332');
          ctx.fillStyle = gGrad;
          ctx.fillRect(0, groundScreenY - 15, W, H - groundScreenY + 280);

          var padSize = BASE_SIZE + 76;
          var p0 = isoToScreen(-padSize / 2, 0, -padSize / 2);
          var p1 = isoToScreen(padSize / 2, 0, -padSize / 2);
          var p2 = isoToScreen(padSize / 2, 0, padSize / 2);
          var p3 = isoToScreen(-padSize / 2, 0, padSize / 2);
          ctx.fillStyle = 'rgba(12, 24, 18, 0.48)';
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.closePath();
          ctx.fill();
        }

        var cloudAlpha = Math.max(0, 1 - Math.max(0, (alt - 0.45) / 0.35)) * 0.35;
        if (cloudAlpha > 0.02) {
          ctx.fillStyle = 'rgba(255, 255, 255, ' + cloudAlpha.toFixed(2) + ')';
          for (var c = 0; c < clouds.length; c++) {
            var cl = clouds[c];
            var cy = H * 0.68 + cameraY - cl.y;
            if (cy > -60 && cy < H + 60) {
              var cx = W / 2 + cl.x;
              ctx.beginPath();
              ctx.ellipse(cx, cy, cl.w * 0.5, 16, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 1. Debris falling behind tower
        for (var j = 0; j < debris.length; j++) {
          if (debris[j].behind) {
            var dbBack = debris[j];
            drawIsoBox(dbBack.x, dbBack.y, dbBack.z, dbBack.w, dbBack.h, dbBack.d, dbBack.hue);
          }
        }

        // 2. Stacked tower blocks
        var startIdx = Math.max(0, stack.length - 30);
        for (var i = startIdx; i < stack.length; i++) {
          var b = stack[i];
          drawIsoBox(b.x, b.y, b.z, b.w, b.h, b.d, b.hue);
        }

        // 2b. Floating 3D Record Pointer Arrow at Personal Best altitude
        if (bestScore > 0) {
          var recordY = BLOCK_H * 1.4 + (bestScore - 1) * BLOCK_H + BLOCK_H;
          var recScreen = isoToScreen(cameraX, recordY, cameraZ);
          if (recScreen.y > -100 && recScreen.y < H + 100) {
            var pulseGlow = 0.65 + 0.35 * Math.sin(time * 5);
            var pad = 110;
            var m0 = isoToScreen(cameraX - pad, recordY, cameraZ - pad);
            var m1 = isoToScreen(cameraX + pad, recordY, cameraZ - pad);
            var m2 = isoToScreen(cameraX + pad, recordY, cameraZ + pad);
            var m3 = isoToScreen(cameraX - pad, recordY, cameraZ + pad);

            ctx.save();
            ctx.strokeStyle = 'rgba(255, 209, 102, ' + pulseGlow.toFixed(2) + ')';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([7, 5]);
            ctx.beginPath();
            ctx.moveTo(m0.x, m0.y);
            ctx.lineTo(m1.x, m1.y);
            ctx.lineTo(m2.x, m2.y);
            ctx.lineTo(m3.x, m3.y);
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);

            var arrowTipX = m1.x + 14;
            var arrowTipY = m1.y;
            var isBeaten = score > bestScore;
            var arrowCol = isBeaten ? '#00f5d4' : '#ffd166';

            ctx.fillStyle = arrowCol;
            ctx.shadowColor = arrowCol;
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.moveTo(arrowTipX, arrowTipY);
            ctx.lineTo(arrowTipX + 32, arrowTipY - 14);
            ctx.lineTo(arrowTipX + 22, arrowTipY - 3);
            ctx.lineTo(arrowTipX + 64, arrowTipY - 3);
            ctx.lineTo(arrowTipX + 64, arrowTipY + 3);
            ctx.lineTo(arrowTipX + 22, arrowTipY + 3);
            ctx.lineTo(arrowTipX + 32, arrowTipY + 14);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = arrowCol;
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(arrowTipX + 24, arrowTipY - 40, 78, 22, 6);
            } else {
              ctx.rect(arrowTipX + 24, arrowTipY - 40, 78, 22);
            }
            ctx.fill();

            ctx.fillStyle = '#141829';
            ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isBeaten ? 'BEATEN!' : 'BEST: ' + bestScore, arrowTipX + 63, arrowTipY - 29);
            ctx.restore();
          }
        }

        // 3. Perfect snap ripples
        for (var r = 0; r < ripples.length; r++) {
          var rp = ripples[r];
          var ex = rp.expand;
          var r0 = isoToScreen(rp.x - ex, rp.y + 1, rp.z - ex);
          var r1 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z - ex);
          var r2 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z + rp.d + ex);
          var r3 = isoToScreen(rp.x - ex, rp.y + 1, rp.z + rp.d + ex);

          ctx.strokeStyle = 'rgba(255, 255, 255, ' + rp.alpha.toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(r0.x, r0.y);
          ctx.lineTo(r1.x, r1.y);
          ctx.lineTo(r2.x, r2.y);
          ctx.lineTo(r3.x, r3.y);
          ctx.closePath();
          ctx.stroke();
        }

        // 4. Active sliding block + overlap guide
        if (gameState === 'PLAYING' && activeBlock) {
          var top = stack[stack.length - 1];
          drawProjectedOverlap(top, activeBlock);
          drawIsoBox(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, BLOCK_H, activeBlock.d, activeBlock.hue);
        }

        // 5. Debris falling in front of tower
        for (var k = 0; k < debris.length; k++) {
          if (!debris[k].behind) {
            var dbFront = debris[k];
            drawIsoBox(dbFront.x, dbFront.y, dbFront.z, dbFront.w, dbFront.h, dbFront.d, dbFront.hue);
          }
        }
      }

      function loop(now) {
        var dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render(now);
        requestAnimationFrame(loop);
      }

      initFoundation();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
