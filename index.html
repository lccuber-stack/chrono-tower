<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chrono Tower</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101526;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    touch-action: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }
  #ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: max(18px, env(safe-area-inset-top)) 22px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  #score-wrap {
    text-align: left;
    background: rgba(10, 15, 30, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  #score {
    font-size: 46px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1.5px;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  #best {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.85;
    margin-top: 5px;
    letter-spacing: 1px;
  }
  #altitude-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-top: 6px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255, 230, 109, 0.16);
    border: 1px solid rgba(255, 230, 109, 0.4);
    color: #ffe66d;
  }
  #sfx-btn {
    pointer-events: auto;
    background: rgba(15, 22, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #ffffff;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s, background 0.2s;
  }
  #sfx-btn:active {
    transform: scale(0.9);
  }
  #sfx-btn svg {
    width: 22px;
    height: 22px;
  }
  #combo-msg {
    position: fixed;
    top: 126px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffe66d;
    background: rgba(12, 18, 36, 0.55);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255, 230, 109, 0.35);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10, 14, 28, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    text-align: center;
    padding: 24px;
    transition: opacity 0.25s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .app-icon {
    width: 104px;
    height: 104px;
    border-radius: 24px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  #overlay h1 {
    margin: 0 0 8px;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2.5px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  }
  #overlay p {
    margin: 0 0 24px;
    font-size: 15px;
    opacity: 0.9;
    max-width: 310px;
    line-height: 1.45;
  }
  #play-btn {
    background: linear-gradient(135deg, #ffffff, #e2e8f0);
    color: #101526;
    border: none;
    padding: 16px 46px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1.4px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s;
  }
  #play-btn:active {
    transform: scale(0.95);
  }
  .credits-text {
    margin-top: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: rgba(255, 255, 255, 0.65);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="score-wrap">
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
    <div id="altitude-tag">EARTH · GROUND LEVEL</div>
  </div>
  <button type="button" id="sfx-btn" aria-label="Toggle Sound">
    <svg id="speaker-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#ffffff" d="M3 9v6h4l5 5V4L7 9H3z"/>
      <path id="sound-waves" fill="#ffffff" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      <line id="mute-slash" x1="3" y1="3" x2="21" y2="21" stroke="#ff4d6d" stroke-width="2.8" stroke-linecap="round" style="display:none;"/>
    </svg>
  </button>
</div>

<div id="combo-msg">PERFECT x1</div>

<div id="overlay">
  <svg class="app-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#090d1a"/>
        <stop offset="55%" stop-color="#1b2a4a"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>
    </defs>
    <rect width="120" height="120" rx="26" fill="url(#skyGrad)"/>
    <circle cx="26" cy="22" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="92" cy="18" r="1.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="80" cy="34" r="1.2" fill="#ffe66d" opacity="0.9"/>
    <circle cx="38" cy="36" r="1.1" fill="#ffffff" opacity="0.7"/>
    <path d="M0 96 Q60 84 120 96 L120 120 L0 120 Z" fill="#1b4332"/>
    <polygon points="60,72 86,84 60,96 34,84" fill="#4cc9f0"/>
    <polygon points="34,84 60,96 60,104 34,92" fill="#4361ee"/>
    <polygon points="60,96 86,84 86,92 60,104" fill="#3a0ca3"/>
    <polygon points="60,57 83,68 60,79 37,68" fill="#00f5d4"/>
    <polygon points="37,68 60,79 60,86 37,75" fill="#00bbf9"/>
    <polygon points="60,79 83,68 83,75 60,86" fill="#0077b6"/>
    <polygon points="60,42 80,52 60,62 40,52" fill="#fee440"/>
    <polygon points="40,52 60,62 60,69 40,59" fill="#f9c74f"/>
    <polygon points="60,62 80,52 80,59 60,69" fill="#f8961e"/>
    <polygon points="60,26 77,35 60,44 43,35" fill="#ff70a6"/>
    <polygon points="43,35 60,44 60,51 43,42" fill="#f72585"/>
    <polygon points="60,44 77,35 77,42 60,51" fill="#b5179e"/>
  </svg>

  <h1 id="ov-title">CHRONO TOWER</h1>
  <p id="ov-sub">Build from Earth's surface through the Moon and Mars into deep space.</p>
  <button type="button" id="play-btn">START</button>
  <div class="credits-text">Special thanks to Emma &amp; Emmy for QA &amp; playtesting support</div>
</div>

<script>
(function() {
  // Generate matching 4-Block Ground-to-Space Apple Touch Icon dynamically for iOS bookmarking
  try {
    var iconCanvas = document.createElement('canvas');
    iconCanvas.width = 180;
    iconCanvas.height = 180;
    var iCtx = iconCanvas.getContext('2d');

    var ig = iCtx.createLinearGradient(0, 0, 0, 180);
    ig.addColorStop(0, '#090d1a');
    ig.addColorStop(0.55, '#1b2a4a');
    ig.addColorStop(1, '#2d6a4f');
    iCtx.fillStyle = ig;
    iCtx.fillRect(0, 0, 180, 180);

    iCtx.fillStyle = '#ffffff';
    iCtx.beginPath();
    iCtx.arc(38, 32, 2.2, 0, Math.PI * 2);
    iCtx.arc(138, 28, 2.5, 0, Math.PI * 2);
    iCtx.arc(120, 50, 1.8, 0, Math.PI * 2);
    iCtx.arc(56, 54, 1.6, 0, Math.PI * 2);
    iCtx.fill();

    iCtx.fillStyle = '#1b4332';
    iCtx.beginPath();
    iCtx.moveTo(0, 144);
    iCtx.quadraticCurveTo(90, 126, 180, 144);
    iCtx.lineTo(180, 180);
    iCtx.lineTo(0, 180);
    iCtx.closePath();
    iCtx.fill();

    function drawMiniBlock(cx, cy, hw, hh, depth, topC, leftC, rightC) {
      iCtx.fillStyle = topC;
      iCtx.beginPath();
      iCtx.moveTo(cx, cy - hh);
      iCtx.lineTo(cx + hw, cy);
      iCtx.lineTo(cx, cy + hh);
      iCtx.lineTo(cx - hw, cy);
      iCtx.closePath();
      iCtx.fill();

      iCtx.fillStyle = leftC;
      iCtx.beginPath();
      iCtx.moveTo(cx - hw, cy);
      iCtx.lineTo(cx, cy + hh);
      iCtx.lineTo(cx, cy + hh + depth);
      iCtx.lineTo(cx - hw, cy + depth);
      iCtx.closePath();
      iCtx.fill();

      iCtx.fillStyle = rightC;
      iCtx.beginPath();
      iCtx.moveTo(cx, cy + hh);
      iCtx.lineTo(cx + hw, cy);
      iCtx.lineTo(cx + hw, cy + depth);
      iCtx.lineTo(cx, cy + hh + depth);
      iCtx.closePath();
      iCtx.fill();
    }

    drawMiniBlock(90, 126, 39, 18, 12, '#4cc9f0', '#4361ee', '#3a0ca3');
    drawMiniBlock(90, 102, 34.5, 16.5, 11, '#00f5d4', '#00bbf9', '#0077b6');
    drawMiniBlock(90, 78, 30, 15, 10, '#fee440', '#f9c74f', '#f8961e');
    drawMiniBlock(90, 53, 25.5, 13.5, 9, '#ff70a6', '#f72585', '#b5179e');

    var link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = iconCanvas.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (e) {}

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = window.innerWidth || 800;
  var H = window.innerHeight || 600;

  function resize() {
    W = window.innerWidth || 800;
    H = window.innerHeight || 600;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var bestScore = 0;
  try {
    var saved = window.localStorage.getItem('chrono_tower_best_v5');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch (e) {}
  document.getElementById('best').textContent = 'BEST: ' + bestScore;

  var audioCtx = null;
  var sfxEnabled = true;
  var scaleNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

  function playNote(comboIdx, isFail) {
    if (!sfxEnabled) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      if (isFail) {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else {
        var note = scaleNotes[Math.min(scaleNotes.length - 1, comboIdx)];
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      }
    } catch (e) {}
  }

  document.getElementById('sfx-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    sfxEnabled = !sfxEnabled;
    var waves = document.getElementById('sound-waves');
    var slash = document.getElementById('mute-slash');
    if (sfxEnabled) {
      waves.style.display = 'block';
      slash.style.display = 'none';
    } else {
      waves.style.display = 'none';
      slash.style.display = 'block';
    }
  });

  var BLOCK_H = 26;
  var BASE_SIZE = 150;
  var MOON_SIZE = 125;
  var MARS_SIZE = 105;
  var currentMaxSpan = BASE_SIZE;
  var stack = [];
  var debris = [];
  var ripples = [];
  var activeBlock = null;
  var gameState = 'MENU';
  var score = 0;
  var combo = 0;
  var passedRecord = false;
  var cameraX = 0;
  var cameraY = 0;
  var cameraZ = 0;
  var targetCameraX = 0;
  var targetCameraY = 0;
  var targetCameraZ = 0;
  var baseHue = 195;

  // Starfield for space & planets
  var stars = [];
  for (var sIdx = 0; sIdx < 95; sIdx++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.7 + Math.random() * 1.8,
      twinkle: Math.random() * Math.PI * 2
    });
  }

  // Earth Clouds (Levels 0 - 19)
  var clouds = [];
  for (var cIdx = 0; cIdx < 10; cIdx++) {
    clouds.push({
      x: (Math.random() - 0.5) * 1400,
      y: 90 + cIdx * 52,
      w: 95 + Math.random() * 90,
      speed: 10 + Math.random() * 14
    });
  }

  // Earth Birds (Levels 1 - 14)
  var birds = [];
  for (var bIdx = 0; bIdx < 8; bIdx++) {
    birds.push({
      x: (Math.random() - 0.5) * 1100,
      y: 70 + bIdx * 42,
      dir: bIdx % 2 === 0 ? 1 : -1,
      speed: 38 + Math.random() * 24,
      wingPhase: Math.random() * Math.PI * 2
    });
  }

  // Earth Airplanes (Levels 8 - 19)
  var planes = [];
  for (var pIdx = 0; pIdx < 3; pIdx++) {
    planes.push({
      x: (Math.random() - 0.5) * 1200,
      y: 230 + pIdx * 110,
      dir: pIdx % 2 === 0 ? 1 : -1,
      speed: 75 + Math.random() * 35
    });
  }

  // Moon Meteors (Levels 20 - 39)
  var meteors = [];
  for (var meIdx = 0; meIdx < 7; meIdx++) {
    meteors.push({
      x: (Math.random() - 0.5) * 1200,
      y: 20 * BLOCK_H + 120 + meIdx * 110,
      speed: 220 + Math.random() * 150,
      len: 35 + Math.random() * 30
    });
  }

  // Moon & Deep Space Asteroids (Levels 20 - 39)
  var asteroids = [];
  for (var asIdx = 0; asIdx < 6; asIdx++) {
    asteroids.push({
      x: (Math.random() - 0.5) * 1100,
      y: 20 * BLOCK_H + 140 + asIdx * 125,
      r: 16 + Math.random() * 16,
      vx: (Math.random() < 0.5 ? 1 : -1) * (18 + Math.random() * 22),
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 1.4
    });
  }

  // Mars Martians & Flying Saucers (Levels 40+)
  var aliens = [];
  for (var alIdx = 0; alIdx < 5; alIdx++) {
    aliens.push({
      x: (Math.random() - 0.5) * 1000,
      y: 40 * BLOCK_H + 140 + alIdx * 140,
      speed: (Math.random() < 0.5 ? 1 : -1) * (48 + Math.random() * 35),
      phase: Math.random() * Math.PI * 2
    });
  }

  // Mars Space Rockets (Levels 40+)
  var rockets = [];
  for (var rkIdx = 0; rkIdx < 4; rkIdx++) {
    rockets.push({
      x: (Math.random() - 0.5) * 1050,
      y: 40 * BLOCK_H + 180 + rkIdx * 165,
      dir: rkIdx % 2 === 0 ? 1 : -1,
      speed: 95 + Math.random() * 45
    });
  }

  function isoToScreen(x, y, z) {
    var originX = W / 2 - cameraX + cameraZ;
    var originY = H * 0.68 + cameraY;
    var sx = originX + (x - z) * 0.866;
    var sy = originY + (x + z) * 0.5 - y;
    return { x: sx, y: sy };
  }

  function hsl(h, s, l) {
    return 'hsl(' + ((h % 360 + 360) % 360) + ',' + s + '%,' + l + '%)';
  }

  function drawIsoBox(x, y, z, w, h, d, hue, isRecordFloor) {
    var p0 = isoToScreen(x, y + h, z);
    var p1 = isoToScreen(x + w, y + h, z);
    var p2 = isoToScreen(x + w, y + h, z + d);
    var p3 = isoToScreen(x, y + h, z + d);

    var b1 = isoToScreen(x + w, y, z);
    var b2 = isoToScreen(x + w, y, z + d);
    var b3 = isoToScreen(x, y, z + d);

    ctx.fillStyle = hsl(hue, 72, 68);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = isRecordFloor ? 'rgba(255, 230, 109, 0.9)' : 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = isRecordFloor ? 2 : 1;
    ctx.stroke();

    ctx.fillStyle = hsl(hue, 64, 52);
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.lineTo(b3.x, b3.y);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = hsl(hue, 58, 38);
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.closePath();
    ctx.fill();
  }

  function drawRecordPointer(floorIndex, nowSec) {
    if (floorIndex <= 0) return;
    var recordY = floorIndex * BLOCK_H + BLOCK_H * 0.9;
    var top = stack[stack.length - 1];
    var targetPt = isoToScreen(top.x + top.w, recordY, top.z);

    if (targetPt.y < -80 || targetPt.y > H + 80) return;

    var isBeaten = score >= floorIndex;
    var mainColor = isBeaten ? '#00f5d4' : '#ffe66d';
    var darkColor = isBeaten ? '#00bbf9' : '#f59e0b';
    var bounce = Math.sin(nowSec * 5) * 6;

    var tipX = targetPt.x + 14 + bounce;
    var tipY = targetPt.y;

    ctx.save();
    ctx.shadowColor = mainColor;
    ctx.shadowBlur = 14;

    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + 24, tipY - 16);
    ctx.lineTo(tipX + 24, tipY - 7);
    ctx.lineTo(tipX + 54, tipY - 7);
    ctx.lineTo(tipX + 54, tipY + 7);
    ctx.lineTo(tipX + 24, tipY + 7);
    ctx.lineTo(tipX + 24, tipY + 16);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = darkColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    var badgeX = tipX + 62;
    var badgeY = tipY - 13;
    var badgeW = 84;
    var badgeH = 26;

    ctx.fillStyle = 'rgba(12, 18, 36, 0.85)';
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 8);
    } else {
      ctx.rect(badgeX, badgeY, badgeW, badgeH);
    }
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = mainColor;
    ctx.font = '800 11px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isBeaten ? 'PASSED ' + floorIndex : 'BEST ' + floorIndex, badgeX + badgeW / 2, badgeY + badgeH / 2);
  }

  function updateAltitudeLabel() {
    var tag = document.getElementById('altitude-tag');
    if (score >= 40) {
      tag.textContent = 'MARS · ALIEN ORBIT';
      tag.style.color = '#ff70a6';
      tag.style.borderColor = 'rgba(255, 112, 166, 0.5)';
      tag.style.background = 'rgba(255, 112, 166, 0.16)';
    } else if (score >= 20) {
      tag.textContent = 'THE MOON · METEOR BELT';
      tag.style.color = '#4cc9f0';
      tag.style.borderColor = 'rgba(76, 201, 240, 0.5)';
      tag.style.background = 'rgba(76, 201, 240, 0.16)';
    } else if (score >= 12) {
      tag.textContent = 'EARTH · STRATOSPHERE';
      tag.style.color = '#90e0ef';
      tag.style.borderColor = 'rgba(144, 224, 239, 0.45)';
      tag.style.background = 'rgba(144, 224, 239, 0.16)';
    } else if (score >= 4) {
      tag.textContent = 'EARTH · CLOUD LAYER';
      tag.style.color = '#ffffff';
      tag.style.borderColor = 'rgba(255, 255, 255, 0.4)';
      tag.style.background = 'rgba(255, 255, 255, 0.15)';
    } else {
      tag.textContent = 'EARTH · GROUND LEVEL';
      tag.style.color = '#ffe66d';
      tag.style.borderColor = 'rgba(255, 230, 109, 0.4)';
      tag.style.background = 'rgba(255, 230, 109, 0.16)';
    }
  }

  function spawnNextBlock() {
    var top = stack[stack.length - 1];
    var axis = (score % 2 === 0) ? 'x' : 'z';
    var speed = Math.min(340, 155 + score * 4.2);
    var hue = baseHue + score * 7;
    var span = axis === 'x' ? top.w : top.d;
    var swingRange = span + 55;

    activeBlock = {
      x: axis === 'x' ? (top.x - swingRange) : top.x,
      y: top.y + top.h,
      z: axis === 'z' ? (top.z - swingRange) : top.z,
      w: top.w,
      d: top.d,
      axis: axis,
      dir: 1,
      speed: speed,
      swingRange: swingRange,
      hue: hue
    };
  }

  function initEarthFoundation() {
    currentMaxSpan = BASE_SIZE;
    stack = [];
    stack.push({
      x: -BASE_SIZE / 2,
      y: 0,
      z: -BASE_SIZE / 2,
      w: BASE_SIZE,
      h: BLOCK_H * 1.4,
      d: BASE_SIZE,
      hue: baseHue
    });
  }

  function startGame() {
    baseHue = 195;
    debris = [];
    ripples = [];
    score = 0;
    combo = 0;
    passedRecord = false;

    initEarthFoundation();

    cameraX = 0;
    cameraY = 0;
    cameraZ = 0;
    targetCameraX = 0;
    targetCameraY = 0;
    targetCameraZ = 0;

    document.getElementById('score').textContent = '0';
    updateAltitudeLabel();
    document.getElementById('combo-msg').style.opacity = '0';
    document.getElementById('overlay').classList.add('hidden');

    gameState = 'PLAYING';
    spawnNextBlock();
  }

  function gameOver() {
    gameState = 'OVER';
    playNote(0, true);
    if (score > bestScore) {
      bestScore = score;
      try {
        window.localStorage.setItem('chrono_tower_best_v5', String(bestScore));
      } catch (e) {}
      document.getElementById('best').textContent = 'BEST: ' + bestScore;
    }
    document.getElementById('ov-title').textContent = 'TOWER COMPLETE';
    document.getElementById('ov-sub').textContent = 'Height: ' + score + ' floors · Best: ' + bestScore;
    document.getElementById('play-btn').textContent = 'PLAY AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function transitionPlanetBase(newFloor, planetHue, newSize) {
    currentMaxSpan = newSize;
    stack = [{
      x: -newSize / 2,
      y: newFloor * BLOCK_H,
      z: -newSize / 2,
      w: newSize,
      h: BLOCK_H * 1.4,
      d: newSize,
      hue: planetHue
    }];
    debris = [];
    ripples = [{
      x: -newSize / 2,
      y: newFloor * BLOCK_H + BLOCK_H * 1.4,
      z: -newSize / 2,
      w: newSize,
      d: newSize,
      alpha: 1.0,
      expand: 0
    }];
  }

  function placeBlock() {
    if (gameState !== 'PLAYING' || !activeBlock) return;
    var top = stack[stack.length - 1];
    var b = activeBlock;
    var SNAP_TOLERANCE = 7;

    if (b.axis === 'x') {
      var deltaX = b.x - top.x;
      if (Math.abs(deltaX) <= SNAP_TOLERANCE) {
        var newW = top.w;
        var newX = top.x;
        combo += 1;
        if (combo >= 5) {
          var grow = 10;
          newW = Math.min(currentMaxSpan, top.w + grow);
          newX = Math.max(-currentMaxSpan / 2, top.x - (newW - top.w) / 2);
        }
        stack.push({ x: newX, y: b.y, z: top.z, w: newW, h: BLOCK_H, d: top.d, hue: b.hue });
        ripples.push({ x: newX, y: b.y, z: top.z, w: newW, d: top.d, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showCombo(combo);
      } else if (Math.abs(deltaX) >= top.w) {
        debris.push({
          x: b.x, y: b.y, z: top.z, w: top.w, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: deltaX > 0 ? 55 : -55, vz: 0,
          behind: deltaX < 0
        });
        activeBlock = null;
        gameOver();
        return;
      } else {
        combo = 0;
        document.getElementById('combo-msg').style.opacity = '0';
        var overlapW = Math.max(4, top.w - Math.abs(deltaX));
        var cutW = Math.abs(deltaX);
        var placedX = deltaX > 0 ? b.x : top.x;
        var cutX = deltaX > 0 ? (placedX + overlapW) : b.x;

        stack.push({ x: placedX, y: b.y, z: top.z, w: overlapW, h: BLOCK_H, d: top.d, hue: b.hue });
        debris.push({
          x: cutX, y: b.y, z: top.z, w: cutW, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: deltaX > 0 ? 75 : -75, vz: 0,
          behind: deltaX < 0
        });
        playNote(0, false);
      }
    } else {
      var deltaZ = b.z - top.z;
      if (Math.abs(deltaZ) <= SNAP_TOLERANCE) {
        var newD = top.d;
        var newZ = top.z;
        combo += 1;
        if (combo >= 5) {
          var growZ = 10;
          newD = Math.min(currentMaxSpan, top.d + growZ);
          newZ = Math.max(-currentMaxSpan / 2, top.z - (newD - top.d) / 2);
        }
        stack.push({ x: top.x, y: b.y, z: newZ, w: top.w, h: BLOCK_H, d: newD, hue: b.hue });
        ripples.push({ x: top.x, y: b.y, z: newZ, w: top.w, d: newD, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showCombo(combo);
      } else if (Math.abs(deltaZ) >= top.d) {
        debris.push({
          x: top.x, y: b.y, z: b.z, w: top.w, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 55 : -55,
          behind: deltaZ < 0
        });
        activeBlock = null;
        gameOver();
        return;
      } else {
        combo = 0;
        document.getElementById('combo-msg').style.opacity = '0';
        var overlapD = Math.max(4, top.d - Math.abs(deltaZ));
        var cutD = Math.abs(deltaZ);
        var placedZ = deltaZ > 0 ? b.z : top.z;
        var cutZ = deltaZ > 0 ? (placedZ + overlapD) : b.z;

        stack.push({ x: top.x, y: b.y, z: placedZ, w: top.w, h: BLOCK_H, d: overlapD, hue: b.hue });
        debris.push({
          x: top.x, y: b.y, z: cutZ, w: top.w, h: BLOCK_H, d: cutD,
          hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 75 : -75,
          behind: deltaZ < 0
        });
        playNote(0, false);
      }
    }

    score += 1;
    document.getElementById('score').textContent = String(score);
    updateAltitudeLabel();

    if (score === 20) {
      transitionPlanetBase(20, 210, MOON_SIZE);
      var moonBanner = document.getElementById('combo-msg');
      moonBanner.textContent = 'WELCOME TO THE MOON!';
      moonBanner.style.opacity = '1';
    } else if (score === 40) {
      transitionPlanetBase(40, 14, MARS_SIZE);
      var marsBanner = document.getElementById('combo-msg');
      marsBanner.textContent = 'WELCOME TO MARS!';
      marsBanner.style.opacity = '1';
    }

    if (!passedRecord && bestScore > 0 && score > bestScore) {
      passedRecord = true;
      var el = document.getElementById('combo-msg');
      el.textContent = 'NEW RECORD!';
      el.style.opacity = '1';
      var topBlock = stack[stack.length - 1];
      ripples.push({ x: topBlock.x, y: topBlock.y, z: topBlock.z, w: topBlock.w, d: topBlock.d, alpha: 1.0, expand: 0 });
    }

    var latest = stack[stack.length - 1];
    targetCameraX = 0;
    targetCameraZ = 0;
    targetCameraY = latest.y;

    spawnNextBlock();
  }

  function showCombo(c) {
    var el = document.getElementById('combo-msg');
    el.textContent = c >= 5 ? 'EXPAND! x' + c : 'PERFECT x' + c;
    el.style.opacity = '1';
  }

  var playBtn = document.getElementById('play-btn');
  playBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (gameState === 'PLAYING') placeBlock();
  });

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (gameState === 'PLAYING') placeBlock();
      else startGame();
    }
  });

  var lastTime = performance.now();

  function update(dt) {
    var smooth = Math.min(1, dt * 8);
    cameraX += (targetCameraX - cameraX) * smooth;
    cameraY += (targetCameraY - cameraY) * smooth;
    cameraZ += (targetCameraZ - cameraZ) * smooth;

    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x += clouds[c].speed * dt;
      if (clouds[c].x > 800) clouds[c].x = -800;
    }

    for (var bd = 0; bd < birds.length; bd++) {
      birds[bd].wingPhase += dt * 11;
      birds[bd].x += birds[bd].dir * birds[bd].speed * dt;
      if (birds[bd].x > 700) birds[bd].x = -700;
      if (birds[bd].x < -700) birds[bd].x = 700;
    }

    for (var pl = 0; pl < planes.length; pl++) {
      planes[pl].x += planes[pl].dir * planes[pl].speed * dt;
      if (planes[pl].x > 800) planes[pl].x = -800;
      if (planes[pl].x < -800) planes[pl].x = 800;
    }

    for (var me = 0; me < meteors.length; me++) {
      meteors[me].y -= meteors[me].speed * dt;
      meteors[me].x += meteors[me].speed * 0.45 * dt;
      if (meteors[me].y < cameraY - 350) {
        meteors[me].y = cameraY + 750 + Math.random() * 250;
        meteors[me].x = (Math.random() - 0.5) * 1100;
      }
    }

    for (var as = 0; as < asteroids.length; as++) {
      asteroids[as].x += asteroids[as].vx * dt;
      asteroids[as].rot += asteroids[as].rotSpd * dt;
      if (asteroids[as].x > 700) asteroids[as].x = -700;
      if (asteroids[as].x < -700) asteroids[as].x = 700;
    }

    for (var al = 0; al < aliens.length; al++) {
      aliens[al].phase += dt * 3;
      aliens[al].x += aliens[al].speed * dt;
      if (aliens[al].x > 650 || aliens[al].x < -650) aliens[al].speed *= -1;
    }

    for (var rk = 0; rk < rockets.length; rk++) {
      rockets[rk].x += rockets[rk].dir * rockets[rk].speed * dt;
      if (rockets[rk].x > 750) rockets[rk].x = -750;
      if (rockets[rk].x < -750) rockets[rk].x = 750;
    }

    if (gameState === 'PLAYING' && activeBlock) {
      var top = stack[stack.length - 1];
      var sr = activeBlock.swingRange;
      if (activeBlock.axis === 'x') {
        activeBlock.x += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.x > top.x + sr) {
          activeBlock.x = top.x + sr;
          activeBlock.dir = -1;
        } else if (activeBlock.x < top.x - sr) {
          activeBlock.x = top.x - sr;
          activeBlock.dir = 1;
        }
      } else {
        activeBlock.z += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.z > top.z + sr) {
          activeBlock.z = top.z + sr;
          activeBlock.dir = -1;
        } else if (activeBlock.z < top.z - sr) {
          activeBlock.z = top.z - sr;
          activeBlock.dir = 1;
        }
      }
    }

    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i];
      d.vy -= 760 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      d.z += d.vz * dt;
      if (d.y < cameraY - 520) {
        debris.splice(i, 1);
      }
    }

    for (var r = ripples.length - 1; r >= 0; r--) {
      var rp = ripples[r];
      rp.expand += 65 * dt;
      rp.alpha -= 1.8 * dt;
      if (rp.alpha <= 0) {
        ripples.splice(r, 1);
      }
    }
  }

  function render(now) {
    var time = now * 0.001;

    var bg = ctx.createLinearGradient(0, 0, 0, H);
    if (score >= 40) {
      bg.addColorStop(0, '#14060c');
      bg.addColorStop(0.55, '#4a141c');
      bg.addColorStop(1, '#9e2a2b');
    } else if (score >= 20) {
      bg.addColorStop(0, '#050811');
      bg.addColorStop(0.6, '#0d1526');
      bg.addColorStop(1, '#1e293b');
    } else {
      var progress = Math.min(1, score / 20);
      bg.addColorStop(0, hsl(208 + progress * 20, 72, Math.max(12, 46 - progress * 34)));
      bg.addColorStop(1, hsl(196 + progress * 25, 68, Math.max(20, 72 - progress * 50)));
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Stars (visible in Moon, Mars, and upper Earth atmosphere)
    var starAlpha = score >= 20 ? 0.9 : Math.max(0, (score - 10) / 10);
    if (starAlpha > 0.02) {
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var alpha = starAlpha * (0.45 + 0.55 * Math.sin(time * 2.2 + st.twinkle));
        ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(st.x * W, st.y * H * 0.78, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // EARTH ZONE (Levels 0 - 19): Ground, Clouds, Birds & Airplanes
    if (score < 20) {
      for (var c = 0; c < clouds.length; c++) {
        var cl = clouds[c];
        var cy = H * 0.68 + cameraY - cl.y;
        if (cy > -60 && cy < H + 60) {
          var cx = W / 2 + cl.x;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
          ctx.beginPath();
          ctx.ellipse(cx, cy, cl.w * 0.5, 16, 0, 0, Math.PI * 2);
          ctx.ellipse(cx - cl.w * 0.24, cy + 5, cl.w * 0.32, 13, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + cl.w * 0.24, cy + 5, cl.w * 0.32, 13, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.strokeStyle = 'rgba(20, 35, 60, 0.65)';
      ctx.lineWidth = 2;
      for (var bd = 0; bd < birds.length; bd++) {
        var br = birds[bd];
        var by = H * 0.68 + cameraY - br.y;
        if (by > -40 && by < H + 40) {
          var bx = W / 2 + br.x;
          var flap = Math.sin(br.wingPhase) * 6;
          ctx.beginPath();
          ctx.moveTo(bx - 10, by - flap);
          ctx.quadraticCurveTo(bx - 4, by - 5, bx, by);
          ctx.quadraticCurveTo(bx + 4, by - 5, bx + 10, by - flap);
          ctx.stroke();
        }
      }

      for (var pl = 0; pl < planes.length; pl++) {
        var pn = planes[pl];
        var py = H * 0.68 + cameraY - pn.y;
        if (py > -50 && py < H + 50) {
          var px = W / 2 + pn.x;
          ctx.save();
          ctx.translate(px, py);
          ctx.scale(pn.dir, 1);

          var trailGrad = ctx.createLinearGradient(-18, 0, -95, 0);
          trailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
          trailGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = trailGrad;
          ctx.fillRect(-95, -1.5, 77, 3);

          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 18, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e2e8f0';
          ctx.beginPath();
          ctx.moveTo(-2, 0);
          ctx.lineTo(-9, -12);
          ctx.lineTo(4, 0);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.lineTo(-19, -7);
          ctx.lineTo(-10, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      var groundScreenY = H * 0.68 + cameraY;
      if (groundScreenY < H + 260) {
        var gGrad = ctx.createLinearGradient(0, groundScreenY - 20, 0, H);
        gGrad.addColorStop(0, '#2d6a4f');
        gGrad.addColorStop(1, '#1b4332');
        ctx.fillStyle = gGrad;
        ctx.fillRect(0, groundScreenY - 15, W, H - groundScreenY + 280);

        var pad0 = isoToScreen(-130, 0, -130);
        var pad1 = isoToScreen(130, 0, -130);
        var pad2 = isoToScreen(130, 0, 130);
        var pad3 = isoToScreen(-130, 0, 130);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.moveTo(pad0.x, pad0.y);
        ctx.lineTo(pad1.x, pad1.y);
        ctx.lineTo(pad2.x, pad2.y);
        ctx.lineTo(pad3.x, pad3.y);
        ctx.closePath();
        ctx.fill();
      }
    }

    // MOON ZONE (Levels 20 - 39): Crater Surface, Asteroids & Falling Meteors
    if (score >= 20 && score < 40) {
      var moonY = H * 0.68 + cameraY - (20 * BLOCK_H);
      if (moonY < H + 260) {
        var mGrad = ctx.createLinearGradient(0, moonY - 20, 0, H);
        mGrad.addColorStop(0, '#4a5568');
        mGrad.addColorStop(1, '#2d3748');
        ctx.fillStyle = mGrad;
        ctx.fillRect(0, moonY - 15, W, H - moonY + 280);

        var moonCraters = [
          { x: W * 0.16, y: moonY + 28, rx: 38, ry: 12 },
          { x: W * 0.34, y: moonY + 75, rx: 26, ry: 9 },
          { x: W * 0.66, y: moonY + 34, rx: 46, ry: 15 },
          { x: W * 0.84, y: moonY + 82, rx: 34, ry: 11 },
          { x: W * 0.48, y: moonY + 115, rx: 52, ry: 16 }
        ];
        for (var cr = 0; cr < moonCraters.length; cr++) {
          var crt = moonCraters[cr];
          ctx.fillStyle = 'rgba(160, 174, 192, 0.35)';
          ctx.beginPath();
          ctx.ellipse(crt.x, crt.y + 2, crt.rx + 4, crt.ry + 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(20, 26, 38, 0.68)';
          ctx.beginPath();
          ctx.ellipse(crt.x, crt.y, crt.rx, crt.ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (var asIdx = 0; asIdx < asteroids.length; asIdx++) {
        var ast = asteroids[asIdx];
        var asy = H * 0.68 + cameraY - ast.y;
        if (asy > -80 && asy < H + 80) {
          var asx = W / 2 + ast.x;
          ctx.save();
          ctx.translate(asx, asy);
          ctx.rotate(ast.rot);

          ctx.fillStyle = '#718096';
          ctx.strokeStyle = '#4a5568';
          ctx.lineWidth = 2;
          ctx.beginPath();
          var sides = 8;
          for (var sd = 0; sd < sides; sd++) {
            var aAng = (sd / sides) * Math.PI * 2;
            var rad = ast.r * (0.82 + 0.24 * Math.sin(sd * 2.5 + asIdx));
            var px = Math.cos(aAng) * rad;
            var py = Math.sin(aAng) * rad;
            if (sd === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#4a5568';
          ctx.beginPath();
          ctx.arc(-ast.r * 0.28, -ast.r * 0.2, ast.r * 0.24, 0, Math.PI * 2);
          ctx.arc(ast.r * 0.32, ast.r * 0.22, ast.r * 0.18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      for (var me = 0; me < meteors.length; me++) {
        var mt = meteors[me];
        var my = H * 0.68 + cameraY - mt.y;
        if (my > -80 && my < H + 80) {
          var mx = W / 2 + mt.x;
          var mTrail = ctx.createLinearGradient(mx, my, mx - mt.len * 0.5, my - mt.len);
          mTrail.addColorStop(0, '#ffe66d');
          mTrail.addColorStop(0.5, '#f77f00');
          mTrail.addColorStop(1, 'rgba(247, 127, 0, 0)');
          ctx.strokeStyle = mTrail;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx - mt.len * 0.5, my - mt.len);
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(mx, my, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // MARS ZONE (Levels 40+): Red Planet Surface, Martians in Flying Saucers & Space Rockets
    if (score >= 40) {
      var marsY = H * 0.68 + cameraY - (40 * BLOCK_H);
      if (marsY < H + 260) {
        var rGrad = ctx.createLinearGradient(0, marsY - 20, 0, H);
        rGrad.addColorStop(0, '#bc4749');
        rGrad.addColorStop(1, '#6a040f');
        ctx.fillStyle = rGrad;
        ctx.fillRect(0, marsY - 15, W, H - marsY + 280);
      }

      for (var al = 0; al < aliens.length; al++) {
        var ufo = aliens[al];
        var uy = H * 0.68 + cameraY - ufo.y + Math.sin(ufo.phase) * 8;
        if (uy > -60 && uy < H + 60) {
          var ux = W / 2 + ufo.x;
          ctx.save();
          ctx.translate(ux, uy);

          var beamGrad = ctx.createLinearGradient(0, 6, 0, 42);
          beamGrad.addColorStop(0, 'rgba(0, 245, 212, 0.32)');
          beamGrad.addColorStop(1, 'rgba(0, 245, 212, 0)');
          ctx.fillStyle = beamGrad;
          ctx.beginPath();
          ctx.moveTo(-10, 6);
          ctx.lineTo(-22, 42);
          ctx.lineTo(22, 42);
          ctx.lineTo(10, 6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#52b788';
          ctx.beginPath();
          ctx.arc(0, -5, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(-2, -6, 1.2, 0, Math.PI * 2);
          ctx.arc(2, -6, 1.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(0, 245, 212, 0.38)';
          ctx.beginPath();
          ctx.arc(0, -4, 11, Math.PI, 0, false);
          ctx.fill();
          ctx.restore();
        }
      }

      for (var rk = 0; rk < rockets.length; rk++) {
        var rkt = rockets[rk];
        var rky = H * 0.68 + cameraY - rkt.y + Math.cos(time * 3 + rk) * 6;
        if (rky > -60 && rky < H + 60) {
          var rkx = W / 2 + rkt.x;
          ctx.save();
          ctx.translate(rkx, rky);
          ctx.scale(rkt.dir, 1);

          var flameLen = 16 + Math.sin(time * 28 + rk) * 6;
          var flameGrad = ctx.createLinearGradient(-18, 0, -18 - flameLen, 0);
          flameGrad.addColorStop(0, '#ffe66d');
          flameGrad.addColorStop(0.5, '#ff6b35');
          flameGrad.addColorStop(1, 'rgba(255, 77, 109, 0)');
          ctx.fillStyle = flameGrad;
          ctx.beginPath();
          ctx.moveTo(-18, -4);
          ctx.lineTo(-18 - flameLen, 0);
          ctx.lineTo(-18, 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#e63946';
          ctx.beginPath();
          ctx.moveTo(-10, -5);
          ctx.lineTo(-20, -12);
          ctx.lineTo(-16, -4);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-10, 5);
          ctx.lineTo(-20, 12);
          ctx.lineTo(-16, 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, 6.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e63946';
          ctx.beginPath();
          ctx.moveTo(12, -5.2);
          ctx.lineTo(24, 0);
          ctx.lineTo(12, 5.2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(3, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // 1. Debris falling behind tower
    for (var j = 0; j < debris.length; j++) {
      if (debris[j].behind) {
        var dbBack = debris[j];
        drawIsoBox(dbBack.x, dbBack.y, dbBack.z, dbBack.w, dbBack.h, dbBack.d, dbBack.hue, false);
      }
    }

    // 2. Stacked tower blocks
    var startIdx = Math.max(0, stack.length - 30);
    for (var i = startIdx; i < stack.length; i++) {
      var b = stack[i];
      var floorNum = Math.round(b.y / BLOCK_H);
      var isRec = (bestScore > 0 && floorNum === bestScore);
      drawIsoBox(b.x, b.y, b.z, b.w, b.h, b.d, b.hue, isRec);
    }

    // 3. Large Glowing High-Score Pointer Arrow
    if (bestScore > 0) {
      drawRecordPointer(bestScore, time);
    }

    // 4. Perfect snap ripples
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      var ex = rp.expand;
      var p0 = isoToScreen(rp.x - ex, rp.y + 1, rp.z - ex);
      var p1 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z - ex);
      var p2 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z + rp.d + ex);
      var p3 = isoToScreen(rp.x - ex, rp.y + 1, rp.z + rp.d + ex);

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + rp.alpha.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.stroke();
    }

    // 5. Real-time overlap shadow & active moving block
    if (gameState === 'PLAYING' && activeBlock) {
      var top = stack[stack.length - 1];
      var shX = Math.max(top.x, activeBlock.x);
      var shZ = Math.max(top.z, activeBlock.z);
      var shW = Math.min(top.x + top.w, activeBlock.x + activeBlock.w) - shX;
      var shD = Math.min(top.z + top.d, activeBlock.z + activeBlock.d) - shZ;

      if (shW > 0 && shD > 0) {
        var sp0 = isoToScreen(shX, activeBlock.y + 0.5, shZ);
        var sp1 = isoToScreen(shX + shW, activeBlock.y + 0.5, shZ);
        var sp2 = isoToScreen(shX + shW, activeBlock.y + 0.5, shZ + shD);
        var sp3 = isoToScreen(shX, activeBlock.y + 0.5, shZ + shD);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.moveTo(sp0.x, sp0.y);
        ctx.lineTo(sp1.x, sp1.y);
        ctx.lineTo(sp2.x, sp2.y);
        ctx.lineTo(sp3.x, sp3.y);
        ctx.closePath();
        ctx.fill();
      }

      drawIsoBox(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, BLOCK_H, activeBlock.d, activeBlock.hue, false);
    }

    // 6. Debris falling in front of tower
    for (var k = 0; k < debris.length; k++) {
      if (!debris[k].behind) {
        var dbFront = debris[k];
        drawIsoBox(dbFront.x, dbFront.y, dbFront.z, dbFront.w, dbFront.h, dbFront.d, dbFront.hue, false);
      }
    }
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  initEarthFoundation();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
