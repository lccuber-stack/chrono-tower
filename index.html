<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chrono Tower</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a1c2c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#ffffff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#ui{position:fixed;top:0;left:0;right:0;padding:max(16px,env(safe-area-inset-top)) 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
#score-wrap{text-align:left}
#score{font-size:48px;font-weight:900;line-height:1;letter-spacing:-1px;text-shadow:0 4px 16px rgba(0,0,0,0.35)}
#best{font-size:13px;font-weight:700;opacity:0.8;margin-top:4px;letter-spacing:1px}
#sfx-btn{pointer-events:auto;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
#sfx-btn:active{background:rgba(255,255,255,0.35)}
#combo-msg{position:fixed;top:110px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:800;letter-spacing:2px;color:#ffe66d;text-shadow:0 2px 10px rgba(0,0,0,0.5);opacity:0;pointer-events:none;z-index:10;transition:opacity 0.2s}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(15,18,32,0.55);backdrop-filter:blur(4px);z-index:20;text-align:center;padding:24px;transition:opacity 0.25s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{margin:0 0 8px;font-size:38px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 20px rgba(0,0,0,0.4)}
#overlay p{margin:0 0 24px;font-size:15px;opacity:0.9;max-width:300px;line-height:1.4}
#play-btn{background:#ffffff;color:#1a1c2c;border:none;padding:15px 38px;border-radius:30px;font-size:16px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,0.35)}
#play-btn:active{transform:scale(0.96)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score-wrap">
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
  </div>
  <button id="sfx-btn">SFX: ON</button>
</div>
<div id="combo-msg">PERFECT x2</div>
<div id="overlay">
  <h1 id="ov-title">CHRONO TOWER</h1>
  <p id="ov-sub">Tap, click, or press Space when the moving block aligns with the tower.</p>
  <button id="play-btn">START</button>
</div>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = window.innerWidth || 800;
  var H = window.innerHeight || 600;

  function resize() {
    W = window.innerWidth || 800;
    H = window.innerHeight || 600;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Safe local storage
  var bestScore = 0;
  try {
    var saved = window.localStorage.getItem('chrono_tower_best');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch (e) {}
  document.getElementById('best').textContent = 'BEST: ' + bestScore;

  // Musical scale Web Audio synthesizer
  var audioCtx = null;
  var sfxEnabled = true;
  var scaleNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

  function playNote(comboIdx, isFail) {
    if (!sfxEnabled) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      if (isFail) {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else {
        var note = scaleNotes[Math.min(scaleNotes.length - 1, comboIdx)];
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      }
    } catch (e) {}
  }

  document.getElementById('sfx-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    sfxEnabled = !sfxEnabled;
    this.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
  });

  // Isometric projection helpers
  var BLOCK_H = 26;
  var BASE_SIZE = 150;
  var stack = [];
  var debris = [];
  var ripples = [];
  var activeBlock = null;
  var state = 'MENU'; // MENU, PLAYING, OVER
  var score = 0;
  var combo = 0;
  var cameraY = 0;
  var targetCameraY = 0;
  var baseHue = 200;

  function isoPoint(x, y, z) {
    var originX = W / 2;
    var originY = H * 0.66 + cameraY;
    var sx = originX + (x - z) * 0.866;
    var sy = originY + (x + z) * 0.5 - y;
    return { x: sx, y: sy };
  }

  function hsl(h, s, l) {
    return 'hsl(' + (h % 360) + ',' + s + '%,' + l + '%)';
  }

  function drawIsoBox(x, y, z, w, h, d, hue) {
    var p0 = isoPoint(x, y + h, z);
    var p1 = isoPoint(x + w, y + h, z);
    var p2 = isoPoint(x + w, y + h, z + d);
    var p3 = isoPoint(x, y + h, z + d);

    var b1 = isoPoint(x + w, y, z);
    var b2 = isoPoint(x + w, y, z + d);
    var b3 = isoPoint(x, y, z + d);

    // Top face
    ctx.fillStyle = hsl(hue, 72, 68);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fill();

    // Left-front face (z + d)
    ctx.fillStyle = hsl(hue, 65, 52);
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.lineTo(b3.x, b3.y);
    ctx.closePath();
    ctx.fill();

    // Right-front face (x + w)
    ctx.fillStyle = hsl(hue, 60, 38);
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.closePath();
    ctx.fill();
  }

  function spawnNextBlock() {
    var top = stack[stack.length - 1];
    var axis = stack.length % 2 === 1 ? 'x' : 'z';
    var speed = Math.min(340, 155 + stack.length * 4.5);
    var hue = baseHue + stack.length * 7;
    var offset = -220;

    activeBlock = {
      x: axis === 'x' ? top.x + offset : top.x,
      y: top.y + BLOCK_H,
      z: axis === 'z' ? top.z + offset : top.z,
      w: top.w,
      d: top.d,
      axis: axis,
      dir: 1,
      speed: speed,
      hue: hue
    };
  }

  function startGame() {
    baseHue = Math.floor(Math.random() * 360);
    stack = [];
    debris = [];
    ripples = [];
    score = 0;
    combo = 0;
    cameraY = 0;
    targetCameraY = 0;

    // Foundation tower base
    stack.push({
      x: -BASE_SIZE / 2,
      y: -BLOCK_H * 4,
      z: -BASE_SIZE / 2,
      w: BASE_SIZE,
      h: BLOCK_H * 5,
      d: BASE_SIZE,
      hue: baseHue
    });

    document.getElementById('score').textContent = '0';
    document.getElementById('combo-msg').style.opacity = '0';
    document.getElementById('overlay').classList.add('hidden');
    state = 'PLAYING';
    spawnNextBlock();
  }

  function gameOver() {
    state = 'OVER';
    playNote(0, true);
    if (score > bestScore) {
      bestScore = score;
      try {
        window.localStorage.setItem('chrono_tower_best', String(bestScore));
      } catch (e) {}
      document.getElementById('best').textContent = 'BEST: ' + bestScore;
    }
    document.getElementById('ov-title').textContent = 'TOWER COMPLETE';
    document.getElementById('ov-sub').textContent = 'Height: ' + score + ' floors | Best: ' + bestScore;
    document.getElementById('play-btn').textContent = 'PLAY AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function placeBlock() {
    if (state !== 'PLAYING' || !activeBlock) return;
    var top = stack[stack.length - 1];
    var b = activeBlock;
    var SNAP_TOLERANCE = 7;

    if (b.axis === 'x') {
      var deltaX = b.x - top.x;
      if (Math.abs(deltaX) <= SNAP_TOLERANCE) {
        // Perfect snap!
        b.x = top.x;
        combo += 1;
        if (combo >= 5) {
          var grow = 10;
          b.w = Math.min(BASE_SIZE, b.w + grow);
          b.x = Math.max(-BASE_SIZE / 2, b.x - grow / 2);
        }
        stack.push({ x: b.x, y: b.y, z: b.z, w: b.w, h: BLOCK_H, d: b.d, hue: b.hue });
        ripples.push({ x: b.x, y: b.y, z: b.z, w: b.w, d: b.d, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showCombo(combo);
      } else if (Math.abs(deltaX) >= top.w) {
        // Complete miss
        debris.push({ x: b.x, y: b.y, z: b.z, w: b.w, h: BLOCK_H, d: b.d, hue: b.hue, vy: 0, vx: deltaX > 0 ? 50 : -50, vz: 0 });
        activeBlock = null;
        gameOver();
        return;
      } else {
        // Slice overhang
        combo = 0;
        document.getElementById('combo-msg').style.opacity = '0';
        var overlapW = top.w - Math.abs(deltaX);
        var cutW = Math.abs(deltaX);
        var placedX = deltaX > 0 ? b.x : top.x;
        var cutX = deltaX > 0 ? (placedX + overlapW) : b.x;

        stack.push({ x: placedX, y: b.y, z: b.z, w: overlapW, h: BLOCK_H, d: b.d, hue: b.hue });
        debris.push({ x: cutX, y: b.y, z: b.z, w: cutW, h: BLOCK_H, d: b.d, hue: b.hue, vy: 0, vx: deltaX > 0 ? 75 : -75, vz: 0 });
        playNote(0, false);
      }
    } else {
      var deltaZ = b.z - top.z;
      if (Math.abs(deltaZ) <= SNAP_TOLERANCE) {
        // Perfect snap!
        b.z = top.z;
        combo += 1;
        if (combo >= 5) {
          var growZ = 10;
          b.d = Math.min(BASE_SIZE, b.d + growZ);
          b.z = Math.max(-BASE_SIZE / 2, b.z - growZ / 2);
        }
        stack.push({ x: b.x, y: b.y, z: b.z, w: b.w, h: BLOCK_H, d: b.d, hue: b.hue });
        ripples.push({ x: b.x, y: b.y, z: b.z, w: b.w, d: b.d, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showCombo(combo);
      } else if (Math.abs(deltaZ) >= top.d) {
        // Complete miss
        debris.push({ x: b.x, y: b.y, z: b.z, w: b.w, h: BLOCK_H, d: b.d, hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 50 : -50 });
        activeBlock = null;
        gameOver();
        return;
      } else {
        // Slice overhang
        combo = 0;
        document.getElementById('combo-msg').style.opacity = '0';
        var overlapD = top.d - Math.abs(deltaZ);
        var cutD = Math.abs(deltaZ);
        var placedZ = deltaZ > 0 ? b.z : top.z;
        var cutZ = deltaZ > 0 ? (placedZ + overlapD) : b.z;

        stack.push({ x: b.x, y: b.y, z: placedZ, w: b.w, h: BLOCK_H, d: overlapD, hue: b.hue });
        debris.push({ x: b.x, y: b.y, z: cutZ, w: b.w, h: BLOCK_H, d: cutD, hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 75 : -75 });
        playNote(0, false);
      }
    }

    score += 1;
    document.getElementById('score').textContent = String(score);
    targetCameraY = (stack.length - 1) * BLOCK_H;
    spawnNextBlock();
  }

  function showCombo(c) {
    var el = document.getElementById('combo-msg');
    el.textContent = c >= 5 ? 'EXPAND! x' + c : 'PERFECT x' + c;
    el.style.opacity = '1';
  }

  // Input handlers
  document.getElementById('play-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (state === 'PLAYING') placeBlock();
  });

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'PLAYING') placeBlock();
      else startGame();
    }
  });

  var lastTime = performance.now();

  function update(dt) {
    cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 7);

    if (state === 'PLAYING' && activeBlock) {
      var top = stack[stack.length - 1];
      var limit = 210;
      if (activeBlock.axis === 'x') {
        activeBlock.x += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.x > top.x + limit) {
          activeBlock.x = top.x + limit;
          activeBlock.dir = -1;
        } else if (activeBlock.x < top.x - limit) {
          activeBlock.x = top.x - limit;
          activeBlock.dir = 1;
        }
      } else {
        activeBlock.z += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.z > top.z + limit) {
          activeBlock.z = top.z + limit;
          activeBlock.dir = -1;
        } else if (activeBlock.z < top.z - limit) {
          activeBlock.z = top.z - limit;
          activeBlock.dir = 1;
        }
      }
    }

    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i];
      d.vy -= 720 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      d.z += d.vz * dt;
      if (d.y < cameraY - 500) {
        debris.splice(i, 1);
      }
    }

    for (var r = ripples.length - 1; r >= 0; r--) {
      var rp = ripples[r];
      rp.expand += 65 * dt;
      rp.alpha -= 1.8 * dt;
      if (rp.alpha <= 0) {
        ripples.splice(r, 1);
      }
    }
  }

  function render() {
    // Dynamic atmospheric background gradient shifting with tower height
    var skyHue = (baseHue + stack.length * 4) % 360;
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, hsl(skyHue, 42, 16));
    bg.addColorStop(1, hsl((skyHue + 40) % 360, 48, 26));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Draw stacked tower blocks (only visible range for smooth 60fps)
    var startIdx = Math.max(0, stack.length - 28);
    for (var i = startIdx; i < stack.length; i++) {
      var b = stack[i];
      drawIsoBox(b.x, b.y, b.z, b.w, b.h, b.d, b.hue);
    }

    // Draw perfect snap ripples
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      var ex = rp.expand;
      var p0 = isoPoint(rp.x - ex, rp.y + 1, rp.z - ex);
      var p1 = isoPoint(rp.x + rp.w + ex, rp.y + 1, rp.z - ex);
      var p2 = isoPoint(rp.x + rp.w + ex, rp.y + 1, rp.z + rp.d + ex);
      var p3 = isoPoint(rp.x - ex, rp.y + 1, rp.z + rp.d + ex);

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + rp.alpha.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.stroke();
    }

    // Draw active sliding block
    if (state === 'PLAYING' && activeBlock) {
      drawIsoBox(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, BLOCK_H, activeBlock.d, activeBlock.hue);
    }

    // Draw falling sliced debris
    for (var j = 0; j < debris.length; j++) {
      var db = debris[j];
      drawIsoBox(db.x, db.y, db.z, db.w, db.h, db.d, db.hue);
    }
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Initial preview tower behind start screen
  stack.push({
    x: -BASE_SIZE / 2,
    y: -BLOCK_H * 4,
    z: -BASE_SIZE / 2,
    w: BASE_SIZE,
    h: BLOCK_H * 5,
    d: BASE_SIZE,
    hue: baseHue
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
