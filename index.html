<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chrono Tower</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101526;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    touch-action: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }
  #ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: max(18px, env(safe-area-inset-top)) 22px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  #score-wrap {
    text-align: left;
    background: rgba(10, 15, 30, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  #score {
    font-size: 46px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1.5px;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  #best {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.85;
    margin-top: 5px;
    letter-spacing: 1px;
  }
  #altitude-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-top: 6px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255, 230, 109, 0.16);
    border: 1px solid rgba(255, 230, 109, 0.4);
    color: #ffe66d;
  }
  #sfx-btn {
    pointer-events: auto;
    background: rgba(15, 22, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #ffffff;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s, background 0.2s;
  }
  #sfx-btn:active {
    transform: scale(0.9);
  }
  #sfx-btn svg {
    width: 22px;
    height: 22px;
  }
  #combo-msg {
    position: fixed;
    top: 126px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffe66d;
    background: rgba(12, 18, 36, 0.55);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255, 230, 109, 0.35);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10, 14, 28, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    text-align: center;
    padding: 24px;
    transition: opacity 0.25s;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .app-icon {
    width: 104px;
    height: 104px;
    border-radius: 24px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  #overlay h1 {
    margin: 0 0 8px;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2.5px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  }
  #overlay p {
    margin: 0 0 24px;
    font-size: 15px;
    opacity: 0.9;
    max-width: 310px;
    line-height: 1.45;
  }
  #play-btn {
    background: linear-gradient(135deg, #ffffff, #e2e8f0);
    color: #101526;
    border: none;
    padding: 16px 46px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1.4px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s;
  }
  #play-btn:active {
    transform: scale(0.95);
  }
  .credits-text {
    margin-top: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: rgba(255, 255, 255, 0.65);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="score-wrap">
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
    <div id="altitude-tag">EARTH · GROUND LEVEL</div>
  </div>
  <button type="button" id="sfx-btn" aria-label="Toggle Sound">
    <svg id="speaker-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#ffffff" d="M3 9v6h4l5 5V4L7 9H3z"/>
      <path id="sound-waves" fill="#ffffff" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      <line id="mute-slash" x1="3" y1="3" x2="21" y2="21" stroke="#ff4d6d" stroke-width="2.8" stroke-linecap="round" style="display:none;"/>
    </svg>
  </button>
</div>

<div id="combo-msg">PERFECT x1</div>

<div id="overlay">
  <svg class="app-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#090d1a"/>
        <stop offset="55%" stop-color="#1b2a4a"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>
    </defs>
    <rect width="120" height="120" rx="26" fill="url(#skyGrad)"/>
    <circle cx="26" cy="22" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="92" cy="18" r="1.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="80" cy="34" r="1.2" fill="#ffe66d" opacity="0.9"/>
    <circle cx="38" cy="36" r="1.1" fill="#ffffff" opacity="0.7"/>
    <path d="M0 96 Q60 84 120 96 L120 120 L0 120 Z" fill="#1b4332"/>
    <polygon points="60,72 86,84 60,96 34,84" fill="#4cc9f0"/>
    <polygon points="34,84 60,96 60,104 34,92" fill="#4361ee"/>
    <polygon points="60,96 86,84 86,92 60,104" fill="#3a0ca3"/>
    <polygon points="60,57 83,68 60,79 37,68" fill="#00f5d4"/>
    <polygon points="37,68 60,79 60,86 37,75" fill="#00bbf9"/>
    <polygon points="60,79 83,68 83,75 60,86" fill="#0077b6"/>
    <polygon points="60,42 80,52 60,62 40,52" fill="#fee440"/>
    <polygon points="40,52 60,62 60,69 40,59" fill="#f9c74f"/>
    <polygon points="60,62 80,52 80,59 60,69" fill="#f8961e"/>
    <polygon points="60,26 77,35 60,44 43,35" fill="#ff70a6"/>
    <polygon points="43,35 60,44 60,51 43,42" fill="#f72585"/>
    <polygon points="60,44 77,35 77,42 60,51" fill="#b5179e"/>
  </svg>

  <h1 id="ov-title">CHRONO TOWER</h1>
  <p id="ov-sub">Build from Earth's surface through the Moon and Mars into deep space.</p>
  <button type="button" id="play-btn">START</button>
  <div class="credits-text">Special thanks to Emma &amp; Emmy for playtesting and ideas</div>
</div>

<script>
(function() {
  // Render the exact 4-Block Ground-to-Space SVG icon onto a 180x180 canvas without path bleed
  (function generateHomeScreenIcon() {
    try {
      var svgEl = document.querySelector('svg.app-icon');
      if (!svgEl) return;
      var clone = svgEl.cloneNode(true);
      clone.setAttribute('width', '180');
      clone.setAttribute('height', '180');
      // Remove rounded rect corners on the PNG so iOS applies its native squircle mask cleanly
      var bgRect = clone.querySelector('rect');
      if (bgRect) bgRect.removeAttribute('rx');

      var svgString = new XMLSerializer().serializeToString(clone);
      var svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(svgBlob);

      var img = new Image();
      img.onload = function() {
        var iconCanvas = document.createElement('canvas');
        iconCanvas.width = 180;
        iconCanvas.height = 180;
        var iCtx = iconCanvas.getContext('2d');
        iCtx.drawImage(img, 0, 0, 180, 180);
        URL.revokeObjectURL(url);

        var dataUrl = iconCanvas.toDataURL('image/png');
        var existingLinks = document.querySelectorAll('link[rel*="icon"]');
        for (var l = 0; l < existingLinks.length; l++) {
          existingLinks[l].parentNode.removeChild(existingLinks[l]);
        }

        var appleLink = document.createElement('link');
        appleLink.rel = 'apple-touch-icon';
        appleLink.sizes = '180x180';
        appleLink.href = dataUrl;
        document.head.appendChild(appleLink);

        var favLink = document.createElement('link');
        favLink.rel = 'icon';
        favLink.type = 'image/png';
        favLink.href = dataUrl;
        document.head.appendChild(favLink);
      };
      img.src = url;
    } catch (e) {}
  })();

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = window.innerWidth || 800;
  var H = window.innerHeight || 600;

  function resize() {
    W = window.innerWidth || 800;
    H = window.innerHeight || 600;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var bestScore = 0;
  try {
    var saved = window.localStorage.getItem('chrono_tower_best_v5');
    if (saved) bestScore = parseInt(saved, 10) || 0;
  } catch (e) {}
  document.getElementById('best').textContent = 'BEST: ' + bestScore;

  var audioCtx = null;
  var sfxEnabled = true;
  var scaleNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

  function playNote(comboIdx, isFail) {
    if (!sfxEnabled) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      if (isFail) {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else {
        var note = scaleNotes[Math.min(scaleNotes.length - 1, comboIdx)];
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      }
    } catch (e) {}
  }

  document.getElementById('sfx-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    sfxEnabled = !sfxEnabled;
    var waves = document.getElementById('sound-waves');
    var slash = document.getElementById('mute-slash');
    if (sfxEnabled) {
      waves.style.display = 'block';
      slash.style.display = 'none';
    } else {
      waves.style.display = 'none';
      slash.style.display = 'block';
    }
  });

  var BLOCK_H = 26;
  var BASE_SIZE = 150;
  var MOON_SIZE = 125;
  var MARS_SIZE = 105;
  var currentMaxSpan = BASE_SIZE;
  var stack = [];
  var debris = [];
  var ripples = [];
  var activeBlock = null;
  var gameState = 'MENU';
  var score = 0;
  var combo = 0;
  var passedRecord = false;
  var cameraX = 0;
  var cameraY = 0;
  var cameraZ = 0;
  var targetCameraX = 0;
  var targetCameraY = 0;
  var targetCameraZ = 0;
  var baseHue = 195;

  // Starfield for space & planets
  var stars = [];
  for (var sIdx = 0; sIdx < 95; sIdx++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.7 + Math.random() * 1.8,
      twinkle: Math.random() * Math.PI * 2
    });
  }

  // Earth Clouds (Levels 0 - 19)
  var clouds = [];
  for (var cIdx = 0; cIdx < 10; cIdx++) {
    clouds.push({
      x: (Math.random() - 0.5) * 1400,
      y: 90 + cIdx * 52,
      w: 95 + Math.random() * 90,
      speed: 10 + Math.random() * 14
    });
  }

  // Earth Birds (Levels 1 - 14)
  var birds = [];
  for (var bIdx = 0; bIdx < 8; bIdx++) {
    birds.push({
      x: (Math.random() - 0.5) * 1100,
      y: 70 + bIdx * 42,
      dir: bIdx % 2 === 0 ? 1 : -1,
      speed: 38 + Math.random() * 24,
      wingPhase: Math.random() * Math.PI * 2
    });
  }

  // Earth Airplanes (Levels 8 - 19)
  var planes = [];
  for (var pIdx = 0; pIdx < 3; pIdx++) {
    planes.push({
      x: (Math.random() - 0.5) * 1200,
      y: 230 + pIdx * 110,
      dir: pIdx % 2 === 0 ? 1 : -1,
      speed: 75 + Math.random() * 35
    });
  }

  // International Space Station (ISS) in upper Earth orbit right before the Moon (Levels 15 - 19)
  var iss = {
    x: -360,
    y: 17 * BLOCK_H + 60,
    speed: 24
  };

  // Moon Meteors (Levels 20 - 39)
  var meteors = [];
  for (var mIdx = 0; mIdx < 4; mIdx++) {
    meteors.push({
      x: (Math.random() - 0.5) * 1200,
      y: 20 * BLOCK_H + 150 + mIdx * 135,
      vx: -190 - Math.random() * 120,
      vy: -75 - Math.random() * 45,
      len: 42 + Math.random() * 36
    });
  }

  // Moon Asteroids (Levels 20 - 39)
  var asteroids = [];
  for (var asIdx = 0; asIdx < 3; asIdx++) {
    asteroids.push({
      x: (Math.random() - 0.5) * 1200,
      y: 20 * BLOCK_H + 180 + asIdx * 165,
      vx: (asIdx % 2 === 0 ? 1 : -1) * (24 + Math.random() * 22),
      r: 14 + Math.random() * 14,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 1.4
    });
  }

  // Mars Martians & Flying Saucers (Levels 40+)
  var aliens = [];
  for (var alIdx = 0; alIdx < 3; alIdx++) {
    aliens.push({
      x: (Math.random() - 0.5) * 1000,
      y: 40 * BLOCK_H + 170 + alIdx * 210,
      speed: (Math.random() < 0.5 ? 1 : -1) * (44 + Math.random() * 28),
      phase: Math.random() * Math.PI * 2
    });
  }

  // Mars Space Rockets (Levels 40+)
  var rockets = [];
  for (var rkIdx = 0; rkIdx < 2; rkIdx++) {
    rockets.push({
      x: (Math.random() - 0.5) * 1050,
      y: 40 * BLOCK_H + 240 + rkIdx * 260,
      dir: rkIdx % 2 === 0 ? 1 : -1,
      speed: 88 + Math.random() * 35
    });
  }

  function isoToScreen(x, y, z) {
    var relX = x - cameraX;
    var relY = y - cameraY;
    var relZ = z - cameraZ;
    var originX = W / 2;
    var originY = H * 0.68;
    var sx = originX + (relX - relZ) * 0.866;
    var sy = originY + (relX + relZ) * 0.5 - relY;
    return { x: sx, y: sy };
  }

  function hsl(h, s, l) {
    return 'hsl(' + (((h % 360) + 360) % 360) + ',' + s + '%,' + l + '%)';
  }

  function drawIsoBox(x, y, z, w, h, d, hue, isGoldRecord) {
    var p0 = isoToScreen(x, y + h, z);
    var p1 = isoToScreen(x + w, y + h, z);
    var p2 = isoToScreen(x + w, y + h, z + d);
    var p3 = isoToScreen(x, y + h, z + d);

    var b1 = isoToScreen(x + w, y, z);
    var b2 = isoToScreen(x + w, y, z + d);
    var b3 = isoToScreen(x, y, z + d);

    // Top face
    ctx.fillStyle = isGoldRecord ? '#ffd166' : hsl(hue, 72, 66);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = isGoldRecord ? '#ffffff' : 'rgba(255, 255, 255, 0.24)';
    ctx.lineWidth = isGoldRecord ? 2 : 1;
    ctx.stroke();

    // Left-front face (z + d)
    ctx.fillStyle = isGoldRecord ? '#f4a261' : hsl(hue, 65, 50);
    ctx.beginPath();
    ctx.moveTo(p3.x, p3.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.lineTo(b3.x, b3.y);
    ctx.closePath();
    ctx.fill();

    // Right-front face (x + w)
    ctx.fillStyle = isGoldRecord ? '#e76f51' : hsl(hue, 60, 36);
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.closePath();
    ctx.fill();
  }

  function updateAltitudeTag() {
    var tag = document.getElementById('altitude-tag');
    if (score >= 40) {
      tag.textContent = 'MARS · RED FRONTIER';
      tag.style.color = '#ff758f';
      tag.style.borderColor = 'rgba(255, 117, 143, 0.45)';
      tag.style.background = 'rgba(255, 117, 143, 0.16)';
    } else if (score >= 20) {
      tag.textContent = 'MOON · LUNAR ORBIT';
      tag.style.color = '#90e0ef';
      tag.style.borderColor = 'rgba(144, 224, 239, 0.45)';
      tag.style.background = 'rgba(144, 224, 239, 0.16)';
    } else if (score >= 10) {
      tag.textContent = 'EARTH · HIGH ALTITUDE';
      tag.style.color = '#ffe66d';
      tag.style.borderColor = 'rgba(255, 230, 109, 0.4)';
      tag.style.background = 'rgba(255, 230, 109, 0.16)';
    } else {
      tag.textContent = 'EARTH · GROUND LEVEL';
      tag.style.color = '#ffe66d';
      tag.style.borderColor = 'rgba(255, 230, 109, 0.4)';
      tag.style.background = 'rgba(255, 230, 109, 0.16)';
    }
  }

  function showBanner(text, color) {
    var el = document.getElementById('combo-msg');
    el.textContent = text;
    el.style.color = color || '#ffe66d';
    el.style.opacity = '1';
  }

  function spawnNextBlock() {
    var top = stack[stack.length - 1];
    var axis = stack.length % 2 === 1 ? 'x' : 'z';
    var speed = Math.min(350, 155 + stack.length * 4.2);
    var hue = baseHue + stack.length * 7;
    var span = axis === 'x' ? top.w : top.d;
    var swingRange = span + 55;

    activeBlock = {
      x: axis === 'x' ? (top.x - swingRange) : top.x,
      y: top.y + BLOCK_H,
      z: axis === 'z' ? (top.z - swingRange) : top.z,
      w: top.w,
      d: top.d,
      axis: axis,
      dir: 1,
      speed: speed,
      swingRange: swingRange,
      hue: hue
    };
  }

  function resetToEarth() {
    baseHue = 195;
    currentMaxSpan = BASE_SIZE;
    stack = [];
    debris = [];
    ripples = [];
    score = 0;
    combo = 0;
    passedRecord = false;
    cameraX = 0;
    cameraY = 0;
    cameraZ = 0;
    targetCameraX = 0;
    targetCameraY = 0;
    targetCameraZ = 0;

    stack.push({
      x: -BASE_SIZE / 2,
      y: 0,
      z: -BASE_SIZE / 2,
      w: BASE_SIZE,
      h: BLOCK_H,
      d: BASE_SIZE,
      hue: baseHue,
      isRecord: false
    });
  }

  function startGame() {
    resetToEarth();
    document.getElementById('score').textContent = '0';
    document.getElementById('combo-msg').style.opacity = '0';
    document.getElementById('overlay').classList.add('hidden');
    updateAltitudeTag();
    gameState = 'PLAYING';
    spawnNextBlock();
  }

  function gameOver() {
    gameState = 'OVER';
    playNote(0, true);
    if (score > bestScore) {
      bestScore = score;
      try {
        window.localStorage.setItem('chrono_tower_best_v5', String(bestScore));
      } catch (e) {}
      document.getElementById('best').textContent = 'BEST: ' + bestScore;
    }
    document.getElementById('ov-title').textContent = 'TOWER COMPLETE';
    document.getElementById('ov-sub').textContent = 'Altitude Reached: ' + score + ' floors · Best: ' + bestScore;
    document.getElementById('play-btn').textContent = 'PLAY AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function transitionToPlanet(planetScore, newSize, newHue, bannerText, bannerColor) {
    currentMaxSpan = newSize;
    baseHue = newHue;
    var planetY = planetScore * BLOCK_H;
    stack.push({
      x: -newSize / 2,
      y: planetY,
      z: -newSize / 2,
      w: newSize,
      h: BLOCK_H,
      d: newSize,
      hue: newHue,
      isRecord: false
    });
    ripples.push({
      x: -newSize / 2,
      y: planetY,
      z: -newSize / 2,
      w: newSize,
      d: newSize,
      alpha: 1,
      expand: 0
    });
    showBanner(bannerText, bannerColor);
  }

  function placeBlock() {
    if (gameState !== 'PLAYING' || !activeBlock) return;
    var top = stack[stack.length - 1];
    var b = activeBlock;
    var SNAP_TOLERANCE = 7;

    var nextFloor = score + 1;
    var hitRecord = bestScore > 0 && nextFloor === bestScore && !passedRecord;
    if (hitRecord) {
      passedRecord = true;
    }

    if (b.axis === 'x') {
      var deltaX = b.x - top.x;
      if (Math.abs(deltaX) <= SNAP_TOLERANCE) {
        var newW = top.w;
        var newX = top.x;
        combo += 1;
        if (combo >= 5) {
          var grow = 10;
          newW = Math.min(currentMaxSpan, top.w + grow);
          newX = Math.max(-currentMaxSpan / 2, top.x - (newW - top.w) / 2);
        }
        stack.push({ x: newX, y: b.y, z: top.z, w: newW, h: BLOCK_H, d: top.d, hue: b.hue, isRecord: hitRecord });
        ripples.push({ x: newX, y: b.y, z: top.z, w: newW, d: top.d, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showBanner(hitRecord ? 'NEW RECORD!' : (combo >= 5 ? 'EXPAND! x' + combo : 'PERFECT x' + combo), hitRecord ? '#ffd166' : '#ffe66d');
      } else if (Math.abs(deltaX) >= top.w) {
        debris.push({
          x: b.x, y: b.y, z: top.z, w: top.w, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: deltaX > 0 ? 50 : -50, vz: 0,
          behind: deltaX < 0
        });
        activeBlock = null;
        gameOver();
        return;
      } else {
        combo = 0;
        if (!hitRecord) document.getElementById('combo-msg').style.opacity = '0';
        var overlapW = Math.max(4, top.w - Math.abs(deltaX));
        var cutW = Math.abs(deltaX);
        var placedX = deltaX > 0 ? b.x : top.x;
        var cutX = deltaX > 0 ? (placedX + overlapW) : b.x;

        stack.push({ x: placedX, y: b.y, z: top.z, w: overlapW, h: BLOCK_H, d: top.d, hue: b.hue, isRecord: hitRecord });
        debris.push({
          x: cutX, y: b.y, z: top.z, w: cutW, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: deltaX > 0 ? 75 : -75, vz: 0,
          behind: deltaX < 0
        });
        playNote(0, false);
        if (hitRecord) showBanner('NEW RECORD!', '#ffd166');
      }
    } else {
      var deltaZ = b.z - top.z;
      if (Math.abs(deltaZ) <= SNAP_TOLERANCE) {
        var newD = top.d;
        var newZ = top.z;
        combo += 1;
        if (combo >= 5) {
          var growZ = 10;
          newD = Math.min(currentMaxSpan, top.d + growZ);
          newZ = Math.max(-currentMaxSpan / 2, top.z - (newD - top.d) / 2);
        }
        stack.push({ x: top.x, y: b.y, z: newZ, w: top.w, h: BLOCK_H, d: newD, hue: b.hue, isRecord: hitRecord });
        ripples.push({ x: top.x, y: b.y, z: newZ, w: top.w, d: newD, alpha: 0.9, expand: 0 });
        playNote(combo - 1, false);
        showBanner(hitRecord ? 'NEW RECORD!' : (combo >= 5 ? 'EXPAND! x' + combo : 'PERFECT x' + combo), hitRecord ? '#ffd166' : '#ffe66d');
      } else if (Math.abs(deltaZ) >= top.d) {
        debris.push({
          x: top.x, y: b.y, z: b.z, w: top.w, h: BLOCK_H, d: top.d,
          hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 50 : -50,
          behind: deltaZ < 0
        });
        activeBlock = null;
        gameOver();
        return;
      } else {
        combo = 0;
        if (!hitRecord) document.getElementById('combo-msg').style.opacity = '0';
        var overlapD = Math.max(4, top.d - Math.abs(deltaZ));
        var cutD = Math.abs(deltaZ);
        var placedZ = deltaZ > 0 ? b.z : top.z;
        var cutZ = deltaZ > 0 ? (placedZ + overlapD) : b.z;

        stack.push({ x: top.x, y: b.y, z: placedZ, w: top.w, h: BLOCK_H, d: overlapD, hue: b.hue, isRecord: hitRecord });
        debris.push({
          x: top.x, y: b.y, z: cutZ, w: top.w, h: BLOCK_H, d: cutD,
          hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 75 : -75,
          behind: deltaZ < 0
        });
        playNote(0, false);
        if (hitRecord) showBanner('NEW RECORD!', '#ffd166');
      }
    }

    score = nextFloor;
    document.getElementById('score').textContent = String(score);
    updateAltitudeTag();

    // Check planetary stage transitions at Level 20 (Moon) and Level 40 (Mars)
    if (score === 20) {
      transitionToPlanet(20, MOON_SIZE, 210, 'MOON REACHED!', '#90e0ef');
    } else if (score === 40) {
      transitionToPlanet(40, MARS_SIZE, 14, 'MARS REACHED!', '#ff758f');
    }

    var latest = stack[stack.length - 1];
    targetCameraX = 0;
    targetCameraZ = 0;
    targetCameraY = latest.y;

    spawnNextBlock();
  }

  document.getElementById('play-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (gameState === 'PLAYING') placeBlock();
  });

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (gameState === 'PLAYING') placeBlock();
      else startGame();
    }
  });

  var lastTime = performance.now();

  function update(dt) {
    var camLerp = Math.min(1, dt * 6.5);
    cameraX += (targetCameraX - cameraX) * camLerp;
    cameraY += (targetCameraY - cameraY) * camLerp;
    cameraZ += (targetCameraZ - cameraZ) * camLerp;

    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x += clouds[c].speed * dt;
      if (clouds[c].x > 750) clouds[c].x = -750;
    }

    for (var b = 0; b < birds.length; b++) {
      birds[b].x += birds[b].dir * birds[b].speed * dt;
      birds[b].wingPhase += 10 * dt;
      if (birds[b].x > 650) birds[b].x = -650;
      if (birds[b].x < -650) birds[b].x = 650;
    }

    for (var pl = 0; pl < planes.length; pl++) {
      planes[pl].x += planes[pl].dir * planes[pl].speed * dt;
      if (planes[pl].x > 800) planes[pl].x = -800;
      if (planes[pl].x < -800) planes[pl].x = 800;
    }

    iss.x += iss.speed * dt;
    if (iss.x > 650) iss.x = -650;

    for (var me = 0; me < meteors.length; me++) {
      meteors[me].x += meteors[me].vx * dt;
      meteors[me].y += meteors[me].vy * dt;
      if (meteors[me].x < -700) {
        meteors[me].x = 700;
        meteors[me].y = 20 * BLOCK_H + 140 + Math.random() * 520;
      }
    }

    for (var as = 0; as < asteroids.length; as++) {
      asteroids[as].x += asteroids[as].vx * dt;
      asteroids[as].rot += asteroids[as].vRot * dt;
      if (asteroids[as].x > 700) asteroids[as].x = -700;
      if (asteroids[as].x < -700) asteroids[as].x = 700;
    }

    for (var al = 0; al < aliens.length; al++) {
      aliens[al].x += aliens[al].speed * dt;
      aliens[al].phase += 3.5 * dt;
      if (aliens[al].x > 650) aliens[al].x = -650;
      if (aliens[al].x < -650) aliens[al].x = 650;
    }

    for (var rk = 0; rk < rockets.length; rk++) {
      rockets[rk].x += rockets[rk].dir * rockets[rk].speed * dt;
      if (rockets[rk].x > 750) rockets[rk].x = -750;
      if (rockets[rk].x < -750) rockets[rk].x = 750;
    }

    if (gameState === 'PLAYING' && activeBlock) {
      var top = stack[stack.length - 1];
      var sr = activeBlock.swingRange;
      if (activeBlock.axis === 'x') {
        activeBlock.x += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.x > top.x + sr) {
          activeBlock.x = top.x + sr;
          activeBlock.dir = -1;
        } else if (activeBlock.x < top.x - sr) {
          activeBlock.x = top.x - sr;
          activeBlock.dir = 1;
        }
      } else {
        activeBlock.z += activeBlock.dir * activeBlock.speed * dt;
        if (activeBlock.z > top.z + sr) {
          activeBlock.z = top.z + sr;
          activeBlock.dir = -1;
        } else if (activeBlock.z < top.z - sr) {
          activeBlock.z = top.z - sr;
          activeBlock.dir = 1;
        }
      }
    }

    for (var i = debris.length - 1; i >= 0; i--) {
      var d = debris[i];
      d.vy -= 740 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      d.z += d.vz * dt;
      if (d.y < cameraY - 520) {
        debris.splice(i, 1);
      }
    }

    for (var r = ripples.length - 1; r >= 0; r--) {
      var rp = ripples[r];
      rp.expand += 65 * dt;
      rp.alpha -= 1.8 * dt;
      if (rp.alpha <= 0) {
        ripples.splice(r, 1);
      }
    }
  }

  function render(now) {
    var time = now * 0.001;

    // Sky gradient transitions smoothly through Earth (0-19), Moon (20-39), and Mars (40+)
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    if (score >= 40) {
      bg.addColorStop(0, '#14050c');
      bg.addColorStop(0.55, '#4a121e');
      bg.addColorStop(1, '#9e2a2b');
    } else if (score >= 20) {
      bg.addColorStop(0, '#04060d');
      bg.addColorStop(0.6, '#0d1326');
      bg.addColorStop(1, '#1d263b');
    } else {
      var climb = Math.min(1, cameraY / (19 * BLOCK_H));
      bg.addColorStop(0, hsl(212, 65, 48 - climb * 38));
      bg.addColorStop(1, hsl(198, 60, 66 - climb * 44));
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Stars (fade in during upper Earth sky, always visible on Moon & Mars)
    var starAlpha = score >= 20 ? 0.92 : Math.max(0, Math.min(0.85, (cameraY - 220) / 260));
    if (starAlpha > 0.01) {
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var pulse = 0.55 + 0.45 * Math.sin(time * 2.5 + st.twinkle);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (starAlpha * pulse).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(st.x * W, st.y * H * 0.85, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // EARTH ZONE (Levels 0 - 19): Clouds, Birds, Airplanes, ISS & Grass Horizon
    if (score < 20) {
      for (var c = 0; c < clouds.length; c++) {
        var cl = clouds[c];
        var cy = H * 0.68 + cameraY - cl.y;
        if (cy > -80 && cy < H + 80) {
          var cx = W / 2 + cl.x;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
          ctx.beginPath();
          ctx.ellipse(cx, cy, cl.w * 0.5, 16, 0, 0, Math.PI * 2);
          ctx.ellipse(cx - cl.w * 0.22, cy - 6, cl.w * 0.3, 14, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + cl.w * 0.22, cy - 4, cl.w * 0.28, 12, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (var b = 0; b < birds.length; b++) {
        var bd = birds[b];
        var by = H * 0.68 + cameraY - bd.y;
        if (by > -40 && by < H + 40) {
          var bx = W / 2 + bd.x;
          var flap = Math.sin(bd.wingPhase) * 5;
          ctx.strokeStyle = 'rgba(20, 30, 48, 0.75)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(bx - 8, by + flap);
          ctx.quadraticCurveTo(bx - 4, by - 4, bx, by);
          ctx.quadraticCurveTo(bx + 4, by - 4, bx + 8, by + flap);
          ctx.stroke();
        }
      }

      for (var pl = 0; pl < planes.length; pl++) {
        var p = planes[pl];
        var py = H * 0.68 + cameraY - p.y;
        if (py > -60 && py < H + 60) {
          var px = W / 2 + p.x;
          ctx.save();
          ctx.translate(px, py);
          if (p.dir < 0) ctx.scale(-1, 1);

          var trail = ctx.createLinearGradient(-120, 0, -16, 0);
          trail.addColorStop(0, 'rgba(255, 255, 255, 0)');
          trail.addColorStop(1, 'rgba(255, 255, 255, 0.45)');
          ctx.fillStyle = trail;
          ctx.fillRect(-120, -1.5, 104, 3);

          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 18, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#cbd5e1';
          ctx.beginPath();
          ctx.moveTo(-2, 0);
          ctx.lineTo(-10, -12);
          ctx.lineTo(-4, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#ff4d6d';
          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.lineTo(-19, -7);
          ctx.lineTo(-10, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      // International Space Station (ISS) orbiting before reaching the Moon
      var issScreenY = H * 0.68 + cameraY - iss.y;
      if (issScreenY > -90 && issScreenY < H + 90) {
        var issScreenX = W / 2 + iss.x;
        ctx.save();
        ctx.translate(issScreenX, issScreenY);
        ctx.rotate(-0.14);

        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(-58, -2, 116, 4);

        ctx.fillStyle = '#1d4ed8';
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 1;
        var wingOffsets = [-48, -32, 22, 38];
        for (var wIdx = 0; wIdx < wingOffsets.length; wIdx++) {
          var wx = wingOffsets[wIdx];
          ctx.fillRect(wx, -24, 10, 20);
          ctx.strokeRect(wx, -24, 10, 20);
          ctx.fillRect(wx, 4, 10, 20);
          ctx.strokeRect(wx, 4, 10, 20);
        }

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-14, -5, 28, 10);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(-5, -9, 10, 18);

        ctx.fillStyle = Math.sin(time * 6) > 0 ? '#00f5d4' : '#38bdf8';
        ctx.beginPath();
        ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      var groundScreenY = H * 0.68 + cameraY;
      if (groundScreenY < H + 260) {
        var horizonY = groundScreenY - 125;
        var gGrad = ctx.createLinearGradient(0, horizonY, 0, H);
        gGrad.addColorStop(0, '#2d6a4f');
        gGrad.addColorStop(1, '#1b4332');
        ctx.fillStyle = gGrad;
        ctx.fillRect(0, horizonY, W, H - horizonY + 280);

        // Background forest treeline along the horizon
        ctx.fillStyle = '#1b4332';
        for (var tx = 20; tx < W + 40; tx += 36) {
          var th = 22 + Math.abs(Math.sin(tx * 0.13)) * 16;
          ctx.beginPath();
          ctx.moveTo(tx - 16, horizonY + 2);
          ctx.lineTo(tx, horizonY - th);
          ctx.lineTo(tx + 16, horizonY + 2);
          ctx.closePath();
          ctx.fill();
        }

        // Cozy houses nestled in the landscape
        var houses = [
          { x: W * 0.16, y: horizonY + 18, s: 1.0, wall: '#f8edeb', roof: '#e63946' },
          { x: W * 0.24, y: horizonY + 34, s: 0.85, wall: '#fae1dd', roof: '#d62828' },
          { x: W * 0.78, y: horizonY + 22, s: 1.05, wall: '#f1faee', roof: '#e76f51' }
        ];
        for (var hs = 0; hs < houses.length; hs++) {
          var hObj = houses[hs];
          var hw = 26 * hObj.s;
          var hh = 18 * hObj.s;
          // House body
          ctx.fillStyle = hObj.wall;
          ctx.fillRect(hObj.x - hw / 2, hObj.y - hh, hw, hh);
          // Pitched roof
          ctx.fillStyle = hObj.roof;
          ctx.beginPath();
          ctx.moveTo(hObj.x - hw / 2 - 4 * hObj.s, hObj.y - hh);
          ctx.lineTo(hObj.x, hObj.y - hh - 13 * hObj.s);
          ctx.lineTo(hObj.x + hw / 2 + 4 * hObj.s, hObj.y - hh);
          ctx.closePath();
          ctx.fill();
          // Warm lit window
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(hObj.x - 4 * hObj.s, hObj.y - hh * 0.65, 8 * hObj.s, 7 * hObj.s);
        }

        // Foreground pine trees on left and right sides of the clearing
        var fgTrees = [
          { x: W * 0.08, y: horizonY + 48, s: 1.1 },
          { x: W * 0.13, y: horizonY + 72, s: 1.25 },
          { x: W * 0.86, y: horizonY + 52, s: 1.15 },
          { x: W * 0.92, y: horizonY + 80, s: 1.3 }
        ];
        for (var ft = 0; ft < fgTrees.length; ft++) {
          var tr = fgTrees[ft];
          ctx.fillStyle = '#3d2c2e';
          ctx.fillRect(tr.x - 3 * tr.s, tr.y - 6 * tr.s, 6 * tr.s, 8 * tr.s);
          ctx.fillStyle = '#143627';
          ctx.beginPath();
          ctx.moveTo(tr.x - 16 * tr.s, tr.y - 4 * tr.s);
          ctx.lineTo(tr.x, tr.y - 34 * tr.s);
          ctx.lineTo(tr.x + 16 * tr.s, tr.y - 4 * tr.s);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#24553d';
          ctx.beginPath();
          ctx.moveTo(tr.x - 12 * tr.s, tr.y - 16 * tr.s);
          ctx.lineTo(tr.x, tr.y - 42 * tr.s);
          ctx.lineTo(tr.x + 12 * tr.s, tr.y - 16 * tr.s);
          ctx.closePath();
          ctx.fill();
        }

        // Grounded 3D isometric stone launchpad beneath the tower
        var pad0 = isoToScreen(-102, 0, -102);
        var pad1 = isoToScreen(102, 0, -102);
        var pad2 = isoToScreen(102, 0, 102);
        var pad3 = isoToScreen(-102, 0, 102);
        ctx.fillStyle = '#3a5a40';
        ctx.beginPath();
        ctx.moveTo(pad0.x, pad0.y);
        ctx.lineTo(pad1.x, pad1.y);
        ctx.lineTo(pad2.x, pad2.y);
        ctx.lineTo(pad3.x, pad3.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // MOON ZONE (Levels 20 - 39): Cratered Lunar Surface, Meteors & Asteroids
    if (score >= 20 && score < 40) {
      var moonY = H * 0.68 + cameraY - (20 * BLOCK_H);
      if (moonY < H + 260) {
        var mGrad = ctx.createLinearGradient(0, moonY - 15, 0, H);
        mGrad.addColorStop(0, '#94a3b8');
        mGrad.addColorStop(1, '#334155');
        ctx.fillStyle = mGrad;
        ctx.fillRect(0, moonY - 15, W, H - moonY + 280);

        var craters = [
          { x: W * 0.16, y: moonY + 46, rx: 42, ry: 15 },
          { x: W * 0.80, y: moonY + 58, rx: 50, ry: 17 },
          { x: W * 0.34, y: moonY + 115, rx: 32, ry: 11 },
          { x: W * 0.66, y: moonY + 128, rx: 38, ry: 13 },
          { x: W * 0.50, y: moonY + 175, rx: 58, ry: 19 }
        ];
        for (var cr = 0; cr < craters.length; cr++) {
          var crt = craters[cr];
          ctx.fillStyle = 'rgba(15, 23, 42, 0.34)';
          ctx.beginPath();
          ctx.ellipse(crt.x, crt.y, crt.rx, crt.ry, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(226, 232, 240, 0.28)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(crt.x, crt.y + 1, crt.rx, crt.ry, 0, 0.15, Math.PI - 0.15);
          ctx.stroke();
        }
      }

      for (var me = 0; me < meteors.length; me++) {
        var m = meteors[me];
        var my = H * 0.68 + cameraY - m.y;
        if (my > -90 && my < H + 90) {
          var mx = W / 2 + m.x;
          var mGradLine = ctx.createLinearGradient(mx, my, mx + m.len, my - m.len * 0.4);
          mGradLine.addColorStop(0, 'rgba(255, 230, 109, 0.95)');
          mGradLine.addColorStop(1, 'rgba(255, 117, 143, 0)');
          ctx.strokeStyle = mGradLine;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + m.len, my - m.len * 0.4);
          ctx.stroke();
        }
      }

      for (var as = 0; as < asteroids.length; as++) {
        var ast = asteroids[as];
        var asy = H * 0.68 + cameraY - ast.y;
        if (asy > -70 && asy < H + 70) {
          var asx = W / 2 + ast.x;
          ctx.save();
          ctx.translate(asx, asy);
          ctx.rotate(ast.rot);
          ctx.fillStyle = '#64748b';
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          ctx.beginPath();
          var pts = 8;
          for (var pt = 0; pt < pts; pt++) {
            var ang = (pt / pts) * Math.PI * 2;
            var rad = ast.r * (0.82 + 0.24 * Math.sin(pt * 2.5));
            var px = Math.cos(ang) * rad;
            var py = Math.sin(ang) * rad;
            if (pt === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
          ctx.beginPath();
          ctx.arc(-ast.r * 0.25, -ast.r * 0.15, ast.r * 0.24, 0, Math.PI * 2);
          ctx.arc(ast.r * 0.28, ast.r * 0.22, ast.r * 0.18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // MARS ZONE (Levels 40+): Red Planet Mountain Terrain, Martians in Flying Saucers & Space Rockets
    if (score >= 40) {
      var marsY = H * 0.68 + cameraY - (40 * BLOCK_H);
      if (marsY < H + 260) {
        var mHorizon = marsY - 15;

        // Distant Martian mountain range silhouette
        ctx.fillStyle = '#590d22';
        ctx.beginPath();
        ctx.moveTo(0, mHorizon + 10);
        ctx.lineTo(0, mHorizon - 42);
        ctx.lineTo(W * 0.14, mHorizon - 88);
        ctx.lineTo(W * 0.28, mHorizon - 46);
        ctx.lineTo(W * 0.44, mHorizon - 105);
        ctx.lineTo(W * 0.62, mHorizon - 52);
        ctx.lineTo(W * 0.78, mHorizon - 92);
        ctx.lineTo(W * 0.91, mHorizon - 48);
        ctx.lineTo(W, mHorizon - 72);
        ctx.lineTo(W, mHorizon + 10);
        ctx.closePath();
        ctx.fill();

        // Midground crimson ridge
        ctx.fillStyle = '#800f2f';
        ctx.beginPath();
        ctx.moveTo(0, mHorizon + 10);
        ctx.lineTo(0, mHorizon - 22);
        ctx.lineTo(W * 0.19, mHorizon - 54);
        ctx.lineTo(W * 0.36, mHorizon - 26);
        ctx.lineTo(W * 0.55, mHorizon - 64);
        ctx.lineTo(W * 0.73, mHorizon - 28);
        ctx.lineTo(W * 0.88, mHorizon - 50);
        ctx.lineTo(W, mHorizon - 24);
        ctx.lineTo(W, mHorizon + 10);
        ctx.closePath();
        ctx.fill();

        // Foreground Martian surface
        var rGrad = ctx.createLinearGradient(0, mHorizon, 0, H);
        rGrad.addColorStop(0, '#bc4749');
        rGrad.addColorStop(1, '#6a040f');
        ctx.fillStyle = rGrad;
        ctx.fillRect(0, mHorizon, W, H - mHorizon + 280);
      }

      for (var al = 0; al < aliens.length; al++) {
        var ufo = aliens[al];
        var uy = H * 0.68 + cameraY - ufo.y + Math.sin(ufo.phase) * 12;
        if (uy > -80 && uy < H + 80) {
          var ux = W / 2 + ufo.x;

          ctx.fillStyle = 'rgba(0, 245, 212, 0.12)';
          ctx.beginPath();
          ctx.moveTo(ux - 10, uy + 6);
          ctx.lineTo(ux - 26, uy + 48);
          ctx.lineTo(ux + 26, uy + 48);
          ctx.lineTo(ux + 10, uy + 6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.ellipse(ux, uy, 28, 9, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#38b000';
          ctx.beginPath();
          ctx.arc(ux, uy - 7, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.ellipse(ux - 2.2, uy - 7.5, 1.5, 2.2, -0.2, 0, Math.PI * 2);
          ctx.ellipse(ux + 2.2, uy - 7.5, 1.5, 2.2, 0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(144, 224, 239, 0.45)';
          ctx.beginPath();
          ctx.arc(ux, uy - 5, 13, Math.PI, 0);
          ctx.fill();

          ctx.fillStyle = '#00f5d4';
          ctx.beginPath();
          ctx.arc(ux - 16, uy, 2.5, 0, Math.PI * 2);
          ctx.arc(ux, uy + 2, 2.5, 0, Math.PI * 2);
          ctx.arc(ux + 16, uy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (var rk = 0; rk < rockets.length; rk++) {
        var rkt = rockets[rk];
        var rky = H * 0.68 + cameraY - rkt.y;
        if (rky > -70 && rky < H + 70) {
          var rkx = W / 2 + rkt.x;
          ctx.save();
          ctx.translate(rkx, rky);
          if (rkt.dir < 0) ctx.scale(-1, 1);

          var flameLen = 16 + Math.sin(time * 28 + rk) * 6;
          ctx.fillStyle = '#ff9f1c';
          ctx.beginPath();
          ctx.moveTo(-20, -4);
          ctx.lineTo(-20 - flameLen, 0);
          ctx.lineTo(-20, 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#e63946';
          ctx.beginPath();
          ctx.moveTo(-14, -5);
          ctx.lineTo(-22, -12);
          ctx.lineTo(-8, -5);
          ctx.moveTo(-14, 5);
          ctx.lineTo(-22, 12);
          ctx.lineTo(-8, 5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e63946';
          ctx.beginPath();
          ctx.moveTo(14, -5);
          ctx.lineTo(26, 0);
          ctx.lineTo(14, 5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(4, 0, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // 1. Debris falling behind tower
    for (var j = 0; j < debris.length; j++) {
      if (debris[j].behind) {
        var dbBack = debris[j];
        drawIsoBox(dbBack.x, dbBack.y, dbBack.z, dbBack.w, dbBack.h, dbBack.d, dbBack.hue, false);
      }
    }

    // 2. Stacked tower blocks
    var startIdx = Math.max(0, stack.length - 30);
    for (var i = startIdx; i < stack.length; i++) {
      var b = stack[i];
      drawIsoBox(b.x, b.y, b.z, b.w, b.h, b.d, b.hue, b.isRecord);
    }

    // 3. Large Glowing 3D High-Score Pointer Arrow
    if (bestScore > 0) {
      var recY = bestScore * BLOCK_H + BLOCK_H * 0.5;
      var bob = Math.sin(time * 4.5) * 8;
      var targetEdge = isoToScreen(-currentMaxSpan / 2 - 14 - bob, recY, 0);

      if (targetEdge.y > -80 && targetEdge.y < H + 80) {
        var ax = targetEdge.x;
        var ay = targetEdge.y;
        var arrowColor = passedRecord ? '#00f5d4' : '#ffd166';

        ctx.save();
        ctx.shadowColor = arrowColor;
        ctx.shadowBlur = 16;
        ctx.fillStyle = arrowColor;

        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 24, ay - 16);
        ctx.lineTo(ax - 24, ay - 7);
        ctx.lineTo(ax - 54, ay - 7);
        ctx.lineTo(ax - 54, ay + 7);
        ctx.lineTo(ax - 24, ay + 7);
        ctx.lineTo(ax - 24, ay + 16);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.font = '900 12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(passedRecord ? 'NEW BEST!' : 'BEST ' + bestScore, ax - 62, ay + 4);
        ctx.restore();
      }
    }

    // 4. Perfect snap ripples
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      var ex = rp.expand;
      var p0 = isoToScreen(rp.x - ex, rp.y + 1, rp.z - ex);
      var p1 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z - ex);
      var p2 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z + rp.d + ex);
      var p3 = isoToScreen(rp.x - ex, rp.y + 1, rp.z + rp.d + ex);

      ctx.strokeStyle = 'rgba(255, 255, 255, ' + rp.alpha.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.stroke();
    }

    // 5. Drop-shadow footprint & active sliding block
    if (gameState === 'PLAYING' && activeBlock) {
      var top = stack[stack.length - 1];
      var shX = Math.max(top.x, activeBlock.x);
      var shZ = Math.max(top.z, activeBlock.z);
      var shW = Math.min(top.x + top.w, activeBlock.x + activeBlock.w) - shX;
      var shD = Math.min(top.z + top.d, activeBlock.z + activeBlock.d) - shZ;

      if (shW > 0 && shD > 0) {
        var s0 = isoToScreen(shX, top.y + BLOCK_H + 0.5, shZ);
        var s1 = isoToScreen(shX + shW, top.y + BLOCK_H + 0.5, shZ);
        var s2 = isoToScreen(shX + shW, top.y + BLOCK_H + 0.5, shZ + shD);
        var s3 = isoToScreen(shX, top.y + BLOCK_H + 0.5, shZ + shD);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.moveTo(s0.x, s0.y);
        ctx.lineTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        ctx.lineTo(s3.x, s3.y);
        ctx.closePath();
        ctx.fill();
      }

      drawIsoBox(activeBlock.x, activeBlock.y, activeBlock.z, activeBlock.w, BLOCK_H, activeBlock.d, activeBlock.hue, false);
    }

    // 6. Debris falling in front of tower
    for (var k = 0; k < debris.length; k++) {
      if (!debris[k].behind) {
        var dbFront = debris[k];
        drawIsoBox(dbFront.x, dbFront.y, dbFront.z, dbFront.w, dbFront.h, dbFront.d, dbFront.hue, false);
      }
    }
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  resetToEarth();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
