<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chrono Tower</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141829;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: max(18px, env(safe-area-inset-top)) 22px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    #score-box {
      text-align: left;
    }

    #score {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1.5px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    #best {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.85;
      margin-top: 6px;
      letter-spacing: 1.2px;
    }

    #sfx-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.32);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 22px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }

    #sfx-btn:active {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0.95);
    }

    #combo-msg {
      position: fixed;
      top: 118px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffe66d;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }

    #combo-msg.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(12, 15, 28, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 20;
      text-align: center;
      padding: 24px;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 44px);
      font-weight: 900;
      letter-spacing: 2.5px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    #overlay p {
      margin: 0 0 28px;
      font-size: 15px;
      opacity: 0.92;
      max-width: 310px;
      line-height: 1.5;
    }

    #play-btn {
      pointer-events: auto;
      background: #ffffff;
      color: #141829;
      border: none;
      padding: 16px 42px;
      border-radius: 32px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      transition: transform 0.12s, box-shadow 0.12s;
    }

    #play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    #play-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="score-box">
      <div id="score">0</div>
      <div id="best">BEST: 0</div>
    </div>
    <button type="button" id="sfx-btn">SFX: ON</button>
  </div>

  <div id="combo-msg">PERFECT x1</div>

  <div id="overlay">
    <h1 id="ov-title">CHRONO TOWER</h1>
    <p id="ov-sub">Tap, click, or press Space when the moving block aligns with the tower.</p>
    <button type="button" id="play-btn">START</button>
  </div>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('game-canvas');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var sfxBtn = document.getElementById('sfx-btn');
      var comboMsgEl = document.getElementById('combo-msg');
      var overlayEl = document.getElementById('overlay');
      var ovTitleEl = document.getElementById('ov-title');
      var ovSubEl = document.getElementById('ov-sub');
      var playBtn = document.getElementById('play-btn');

      var W = window.innerWidth || 800;
      var H = window.innerHeight || 600;

      function resizeCanvas() {
        W = window.innerWidth || 800;
        H = window.innerHeight || 600;
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      var STORAGE_KEY = 'chrono_tower_best_v3';
      var bestScore = 0;

      function loadBestScore() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw !== null) {
            var parsed = parseInt(raw, 10);
            if (!isNaN(parsed) && parsed > 0) bestScore = parsed;
          }
        } catch (e) {}
        bestEl.textContent = 'BEST: ' + bestScore;
      }

      function saveBestScore(val) {
        if (val > bestScore) {
          bestScore = val;
          bestEl.textContent = 'BEST: ' + bestScore;
          try {
            window.localStorage.setItem(STORAGE_KEY, String(bestScore));
          } catch (e) {}
        }
      }

      loadBestScore();

      var audioCtx = null;
      var sfxEnabled = true;
      var PENTATONIC = [
        261.63, 293.66, 329.63, 392.00, 440.00,
        523.25, 587.33, 659.25, 783.99, 880.00, 1046.50
      ];

      function initAudio() {
        if (!audioCtx) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playPlacementSound(comboIndex, isGameOver) {
        if (!sfxEnabled) return;
        initAudio();
        if (!audioCtx) return;

        try {
          var now = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          if (isGameOver) {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(165, now);
            osc.frequency.exponentialRampToValueAtTime(52, now + 0.38);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.38);
          } else {
            var freq = PENTATONIC[Math.min(PENTATONIC.length - 1, Math.max(0, comboIndex))];
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
          }
        } catch (e) {}
      }

      sfxBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        sfxEnabled = !sfxEnabled;
        sfxBtn.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
        if (sfxEnabled) initAudio();
      });

      var BLOCK_HEIGHT = 26;
      var BASE_SIZE = 150;
      var SNAP_TOLERANCE = 7;

      var stack = [];
      var debris = [];
      var ripples = [];
      var activeBlock = null;

      var gameState = 'MENU';
      var score = 0;
      var combo = 0;
      var cameraX = 0;
      var cameraY = 0;
      var cameraZ = 0;
      var targetCameraX = 0;
      var targetCameraY = 0;
      var targetCameraZ = 0;
      var baseHue = 200;

      function isoToScreen(x, y, z) {
        var rx = x - cameraX;
        var rz = z - cameraZ;
        var originX = W / 2;
        var originY = H * 0.66 + cameraY;
        return {
          x: originX + (rx - rz) * 0.866,
          y: originY + (rx + rz) * 0.5 - y
        };
      }

      function hslColor(h, s, l) {
        return 'hsl(' + (((h % 360) + 360) % 360) + ',' + s + '%,' + l + '%)';
      }

      function drawIsoBox(x, y, z, w, h, d, hue) {
        var p0 = isoToScreen(x, y + h, z);
        var p1 = isoToScreen(x + w, y + h, z);
        var p2 = isoToScreen(x + w, y + h, z + d);
        var p3 = isoToScreen(x, y + h, z + d);

        var b1 = isoToScreen(x + w, y, z);
        var b2 = isoToScreen(x + w, y, z + d);
        var b3 = isoToScreen(x, y, z + d);

        // Top face
        ctx.fillStyle = hslColor(hue, 72, 68);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Left-front face (z + d)
        ctx.fillStyle = hslColor(hue, 65, 52);
        ctx.beginPath();
        ctx.moveTo(p3.x, p3.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y);
        ctx.closePath();
        ctx.fill();

        // Right-front face (x + w)
        ctx.fillStyle = hslColor(hue, 60, 38);
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.closePath();
        ctx.fill();
      }

      function initFoundation() {
        baseHue = Math.floor(Math.random() * 360);
        stack = [{
          x: -BASE_SIZE / 2,
          y: -BLOCK_HEIGHT * 4,
          z: -BASE_SIZE / 2,
          w: BASE_SIZE,
          h: BLOCK_HEIGHT * 5,
          d: BASE_SIZE,
          hue: baseHue
        }];
        debris = [];
        ripples = [];
        cameraX = 0;
        cameraY = 0;
        cameraZ = 0;
        targetCameraX = 0;
        targetCameraY = 0;
        targetCameraZ = 0;
      }

      function spawnNextBlock() {
        var top = stack[stack.length - 1];
        var axis = stack.length % 2 === 1 ? 'x' : 'z';
        var speed = Math.min(340, 155 + stack.length * 4.5);
        var hue = baseHue + stack.length * 7;
        var span = axis === 'x' ? top.w : top.d;
        var swingRange = span + 55;

        activeBlock = {
          x: axis === 'x' ? (top.x - swingRange) : top.x,
          y: top.y + BLOCK_HEIGHT,
          z: axis === 'z' ? (top.z - swingRange) : top.z,
          w: top.w,
          d: top.d,
          axis: axis,
          dir: 1,
          speed: speed,
          swingRange: swingRange,
          hue: hue
        };
      }

      function startGame() {
        initAudio();
        initFoundation();
        score = 0;
        combo = 0;
        scoreEl.textContent = '0';
        comboMsgEl.classList.remove('visible');
        overlayEl.classList.add('hidden');
        gameState = 'PLAYING';
        spawnNextBlock();
      }

      function triggerGameOver() {
        gameState = 'GAMEOVER';
        playPlacementSound(0, true);
        saveBestScore(score);
        ovTitleEl.textContent = 'TOWER COMPLETE';
        ovSubEl.textContent = 'Height: ' + score + ' floors | Best: ' + bestScore;
        playBtn.textContent = 'PLAY AGAIN';
        overlayEl.classList.remove('hidden');
      }

      function placeBlock() {
        if (gameState !== 'PLAYING' || !activeBlock) return;
        var top = stack[stack.length - 1];
        var b = activeBlock;

        if (b.axis === 'x') {
          var deltaX = b.x - top.x;
          var absDeltaX = Math.abs(deltaX);

          if (absDeltaX <= SNAP_TOLERANCE) {
            var newW = top.w;
            var newX = top.x;
            combo += 1;
            if (combo >= 5) {
              var growX = 10;
              newW = Math.min(BASE_SIZE, top.w + growX);
              newX = Math.max(-BASE_SIZE / 2, top.x - (newW - top.w) / 2);
            }
            stack.push({ x: newX, y: b.y, z: top.z, w: newW, h: BLOCK_HEIGHT, d: top.d, hue: b.hue });
            ripples.push({ x: newX, y: b.y, z: top.z, w: newW, d: top.d, alpha: 0.9, expand: 0 });
            playPlacementSound(combo - 1, false);
            comboMsgEl.textContent = combo >= 5 ? 'EXPAND! x' + combo : 'PERFECT x' + combo;
            comboMsgEl.classList.add('visible');
          } else if (absDeltaX >= top.w) {
            debris.push({
              x: b.x, y: b.y, z: top.z, w: top.w, h: BLOCK_HEIGHT, d: top.d,
              hue: b.hue, vy: 0, vx: deltaX > 0 ? 60 : -60, vz: 0,
              behind: deltaX < 0
            });
            activeBlock = null;
            triggerGameOver();
            return;
          } else {
            combo = 0;
            comboMsgEl.classList.remove('visible');
            var overlapW = Math.max(1, Math.min(top.w, top.w - absDeltaX));
            var cutW = Math.max(1, absDeltaX);
            var placedX = deltaX > 0 ? b.x : top.x;
            var cutX = deltaX > 0 ? (placedX + overlapW) : b.x;

            stack.push({ x: placedX, y: b.y, z: top.z, w: overlapW, h: BLOCK_HEIGHT, d: top.d, hue: b.hue });
            debris.push({
              x: cutX, y: b.y, z: top.z, w: cutW, h: BLOCK_HEIGHT, d: top.d,
              hue: b.hue, vy: 0, vx: deltaX > 0 ? 75 : -75, vz: 0,
              behind: deltaX < 0
            });
            playPlacementSound(0, false);
          }
        } else {
          var deltaZ = b.z - top.z;
          var absDeltaZ = Math.abs(deltaZ);

          if (absDeltaZ <= SNAP_TOLERANCE) {
            var newD = top.d;
            var newZ = top.z;
            combo += 1;
            if (combo >= 5) {
              var growZ = 10;
              newD = Math.min(BASE_SIZE, top.d + growZ);
              newZ = Math.max(-BASE_SIZE / 2, top.z - (newD - top.d) / 2);
            }
            stack.push({ x: top.x, y: b.y, z: newZ, w: top.w, h: BLOCK_HEIGHT, d: newD, hue: b.hue });
            ripples.push({ x: top.x, y: b.y, z: newZ, w: top.w, d: newD, alpha: 0.9, expand: 0 });
            playPlacementSound(combo - 1, false);
            comboMsgEl.textContent = combo >= 5 ? 'EXPAND! x' + combo : 'PERFECT x' + combo;
            comboMsgEl.classList.add('visible');
          } else if (absDeltaZ >= top.d) {
            debris.push({
              x: top.x, y: b.y, z: b.z, w: top.w, h: BLOCK_HEIGHT, d: top.d,
              hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 60 : -60,
              behind: deltaZ < 0
            });
            activeBlock = null;
            triggerGameOver();
            return;
          } else {
            combo = 0;
            comboMsgEl.classList.remove('visible');
            var overlapD = Math.max(1, Math.min(top.d, top.d - absDeltaZ));
            var cutD = Math.max(1, absDeltaZ);
            var placedZ = deltaZ > 0 ? b.z : top.z;
            var cutZ = deltaZ > 0 ? (placedZ + overlapD) : b.z;

            stack.push({ x: top.x, y: b.y, z: placedZ, w: top.w, h: BLOCK_HEIGHT, d: overlapD, hue: b.hue });
            debris.push({
              x: top.x, y: b.y, z: cutZ, w: top.w, h: BLOCK_HEIGHT, d: cutD,
              hue: b.hue, vy: 0, vx: 0, vz: deltaZ > 0 ? 75 : -75,
              behind: deltaZ < 0
            });
            playPlacementSound(0, false);
          }
        }

        var newTop = stack[stack.length - 1];
        score += 1;
        scoreEl.textContent = String(score);
        targetCameraX = newTop.x + newTop.w / 2;
        targetCameraY = (stack.length - 1) * BLOCK_HEIGHT;
        targetCameraZ = newTop.z + newTop.d / 2;
        spawnNextBlock();
      }

      playBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });

      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (gameState === 'PLAYING') placeBlock();
      });

      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          if (gameState === 'PLAYING') placeBlock();
          else startGame();
        }
      });

      var lastTime = performance.now();

      function update(dt) {
        var camLerp = Math.min(1, dt * 7.5);
        cameraX += (targetCameraX - cameraX) * camLerp;
        cameraY += (targetCameraY - cameraY) * camLerp;
        cameraZ += (targetCameraZ - cameraZ) * camLerp;

        if (gameState === 'PLAYING' && activeBlock) {
          var top = stack[stack.length - 1];
          var sr = activeBlock.swingRange;
          if (activeBlock.axis === 'x') {
            activeBlock.x += activeBlock.dir * activeBlock.speed * dt;
            if (activeBlock.x > top.x + sr) {
              activeBlock.x = top.x + sr;
              activeBlock.dir = -1;
            } else if (activeBlock.x < top.x - sr) {
              activeBlock.x = top.x - sr;
              activeBlock.dir = 1;
            }
          } else {
            activeBlock.z += activeBlock.dir * activeBlock.speed * dt;
            if (activeBlock.z > top.z + sr) {
              activeBlock.z = top.z + sr;
              activeBlock.dir = -1;
            } else if (activeBlock.z < top.z - sr) {
              activeBlock.z = top.z - sr;
              activeBlock.dir = 1;
            }
          }
        }

        for (var i = debris.length - 1; i >= 0; i--) {
          var d = debris[i];
          d.vy -= 720 * dt;
          d.y += d.vy * dt;
          d.x += d.vx * dt;
          d.z += d.vz * dt;
          if (d.y < cameraY - 500) {
            debris.splice(i, 1);
          }
        }

        for (var r = ripples.length - 1; r >= 0; r--) {
          var rp = ripples[r];
          rp.expand += 65 * dt;
          rp.alpha -= 1.8 * dt;
          if (rp.alpha <= 0) {
            ripples.splice(r, 1);
          }
        }
      }

      function render() {
        var skyHue = (baseHue + stack.length * 4) % 360;
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, hslColor(skyHue, 42, 16));
        bg.addColorStop(1, hslColor((skyHue + 40) % 360, 48, 26));
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // 1. Debris falling behind tower
        for (var j = 0; j < debris.length; j++) {
          if (debris[j].behind) {
            var dbBack = debris[j];
            drawIsoBox(dbBack.x, dbBack.y, dbBack.z, dbBack.w, dbBack.h, dbBack.d, dbBack.hue);
          }
        }

        // 2. Stacked tower blocks
        var startIdx = Math.max(0, stack.length - 28);
        for (var i = startIdx; i < stack.length; i++) {
          var b = stack[i];
          drawIsoBox(b.x, b.y, b.z, b.w, b.h, b.d, b.hue);
        }

        // 3. Perfect snap ripples
        for (var r = 0; r < ripples.length; r++) {
          var rp = ripples[r];
          var ex = rp.expand;
          var p0 = isoToScreen(rp.x - ex, rp.y + 1, rp.z - ex);
          var p1 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z - ex);
          var p2 = isoToScreen(rp.x + rp.w + ex, rp.y + 1, rp.z + rp.d + ex);
          var p3 = isoToScreen(rp.x - ex, rp.y + 1, rp.z + rp.d + ex);

          ctx.strokeStyle = 'rgba(255, 255, 255, ' + rp.alpha.toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.closePath();
          ctx.stroke();
        }

        // 4. Projected alignment shadow on top surface
        if (gameState === 'PLAYING' && activeBlock && stack.length > 0) {
          var top = stack[stack.length - 1];
          var surfaceY = top.y + top.h;
          var minX = Math.max(top.x, activeBlock.x);
          var maxX = Math.min(top.x + top.w, activeBlock.x + activeBlock.w);
          var minZ = Math.max(top.z, activeBlock.z);
          var maxZ = Math.min(top.z + top.d, activeBlock.z + activeBlock.d);

          if (maxX > minX && maxZ > minZ) {
            var s0 = isoToScreen(minX, surfaceY, minZ);
            var s1 = isoToScreen(maxX, surfaceY, minZ);
            var s2 = isoToScreen(maxX, surfaceY, maxZ);
            var s3 = isoToScreen(minX, surfaceY, maxZ);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
            ctx.beginPath();
            ctx.moveTo(s0.x, s0.y);
            ctx.lineTo(s1.x, s1.y);
            ctx.lineTo(s2.x, s2.y);
            ctx.lineTo(s3.x, s3.y);
            ctx.closePath();
            ctx.fill();
          }
        }

        // 5. Active moving block
        if (gameState === 'PLAYING' && activeBlock) {
          drawIsoBox(
            activeBlock.x,
            activeBlock.y,
            activeBlock.z,
            activeBlock.w,
            BLOCK_HEIGHT,
            activeBlock.d,
            activeBlock.hue
          );
        }

        // 6. Debris falling in front of tower
        for (var k = 0; k < debris.length; k++) {
          if (!debris[k].behind) {
            var dbFront = debris[k];
            drawIsoBox(dbFront.x, dbFront.y, dbFront.z, dbFront.w, dbFront.h, dbFront.d, dbFront.hue);
          }
        }
      }

      function loop(now) {
        var dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      initFoundation();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
